*{box-sizing:border-box;margin:0;padding:0}

body{background:#0d1117;font-family:'Crimson Text',Georgia,serif;color:#c9d1d9;overflow:hidden}

a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}

.scard:hover{border-color:#30363d;background:#1c2128;transform:translateY(-1px)}
.ccard{transition:all .18s;cursor:pointer;border-radius:7px;padding:14px;margin-bottom:8px;border:1px solid #21262d;background:#161b22}
.ccard:hover{border-color:#30363d;background:#1c2128;transform:translateY(-1px)}
.chip{display:inline-block;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;margin-right:3px;margin-bottom:3px;border:1px solid transparent;transition:opacity .15s}
.ftag{cursor:pointer;padding:3px 9px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #30363d;background:transparent;transition:all .15s;font-weight:500}

.dsec{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #21262d}
.dsec:last-child{border-bottom:none}
.cbtn{background:#21262d;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;transition:all .15s;flex-shrink:0}
.cbtn:hover{background:#30363d;color:#c9d1d9}
.badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;flex-shrink:0}
.modetab{cursor:pointer;padding:5px 13px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #30363d;background:transparent;transition:all .2s;letter-spacing:.04em;color:#8b949e}

input[type=text]{outline:none}
.about-panel{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}

ive systems","Self-organization","Attractor dynamics","Multimorbidity as network disturbance"],"code":"E4"},{"id":5,"name":"Neurodiversity, Disability & Human Variation","shortName":"Neurodiversity","color":"#F48FB1","glow":"rgba(244,143,177,0.3)","question":"How do we interpret variation without collapsing back into deficit models?","domains":["Neurodiversity paradigm","Social & relational disability models","Double empathy","Monotropism","Identity, masking, burnout","Human variation & specialization"],"code":"E5"},{"id":6,"name":"Evolution, Ecology & Population-Level Diversity","shortName":"Evolution","color":"#80DEEA","glow":"rgba(128,222,234,0.3)","question":"Why would variation in stress responsivity persist or matter at the population level?","domains":["Evolution under environmental stress","Developmental systems theory","Niche construction","Social-ecological systems","Cooperative cognition","Functional & response diversity"],"code":"E6"}],"layers":[{"id":1,"name":"Foundational Regulation Theory","shortName":"Regulation","color":"#4FC3F7","glow":"rgba(79,195,247,0.3)","question":"How do organisms regulate themselves across uncertainty, time, and changing environments?","domains":["Allostasis","Predictive processing / active inference","Interoception","Energy allocation","Complex adaptive systems"],"code":"E1"},{"id":2,"name":"Biological Mechanisms of Stress Adaptation","shortName":"Mechanisms","color":"#A5D6A7","glow":"rgba(165,214,167,0.3)","question":"Through what mechanisms does stress reorganize the organism?","domains":["Mitochondria & cellular energetics","HPA-axis / neuroendocrine","Immune regulation","Oxidative stress / redox","Gut-brain signaling","Autonomic regulation"],"code":"E2"},{"id":3,"name":"Developmental Calibration & Plasticity","shortName":"Development","color":"#FFCC80","glow":"rgba(255,204,128,0.3)","question":"How do early conditions shape later regulatory style, sensitivity, and vulnerability?","domains":["Developmental plasticity","Differential susceptibility","Adaptive calibration","Prenatal & early-life stress","Epigenetics & transgenerational effects"],"code":"E3"},{"id":4,"name":"Emergence, Complexity & Network Medicine","shortName":"Complexity","color":"#CE93D8","glow":"rgba(206,147,216,0.3)","question":"How do complex organism-environment networks generate stable or unstable patterns?","domains":["Network medicine","Complex adaptive systems","Self-organization","Attractor dynamics","Multimorbidity as network disturbance"],"code":"E4"},{"id":5,"name":"Neurodiversity, Disability & Human Variation","shortName":"Neurodiversity","color":"#F48FB1","glow":"rgba(244,143,177,0.3)","question":"How do we interpret variation without collapsing back into deficit models?","domains":["Neurodiversity paradigm","Social & relational disability models","Double empathy","Monotropism","Identity, masking, burnout","Human variation & specialization"],"code":"E5"},{"id":6,"name":"Evolution, Ecology & Population-Level Diversity","shortName":"Evolution","color":"#80DEEA","glow":"rgba(128,222,234,0.3)","question":"Why would variation in stress responsivity persist or matter at the population level?","domains":["Evolution under environmental stress","Developmental systems theory","Niche construction","Social-ecological systems","Cooperative cognition","Functional & response diversity"],"code":"E6"}],"tags":{"REG":{"label":"REG","title":"Regulation / allostasis","color":"#4FC3F7"},"INT":{"label":"INT","title":"Interoception","color":"#81D4FA"},"PP":{"label":"PP","title":"Predictive processing / active inference","color":"#4FC3F7"},"EN":{"label":"EN","title":"Energy metabolism / bioenergetics","color":"#A5D6A7"},"STR":{"label":"STR","title":"Stress physiology","color":"#FFCC80"},"DEV":{"label":"DEV","title":"Developmental calibration / plasticity","color":"#FFB74D"},"EPI":{"label":"EPI","title":"Epigenetics / transgenerational","color":"#FFCC80"},"NET":{"label":"NET","title":"Complexity / network medicine","color":"#CE93D8"},"ND":{"label":"ND","title":"Neurodiversity / disability / lived experience","color":"#F48FB1"},"EVO":{"label":"EVO","title":"Evolution / ecology / niche construction","color":"#80DEEA"},"SOC":{"label":"SOC","title":"Social buffering / relational regulation","color":"#B39DDB"},"CLIN":{"label":"CLIN","title":"Clinical translation / biomarkers","color":"#80CBC4"},"METH":{"label":"METH","title":"Methodological / epistemic critique","color":"#BCAAA4"}},"public_claims":[{"id":"pc01","n":1,"group":"Opening","headline":"Stress is part of adaptive regulation, not merely damage.","body":"In ESF, stress names information-bearing adaptive work through which living systems anticipate, meet, update to and recover from demand. Stress can become costly or destabilizing, but it should not be reduced to damage, distress or overload.","status":"Strong convergent support","boundary":"Do not imply that every demand is harmful or that every stress response is beneficial.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc02","n":2,"group":"Opening","headline":"Many health problems involve regulation under constraint, not isolated pathology alone.","body":"Health patterns can arise through interacting limits on prediction, energy allocation, repair, coordination and recovery. Local pathology remains real, but it may not fully explain the pattern that appears across one brain-body-environment system.","status":"ESF synthesis","boundary":"This is not a claim that all illness is regulatory or that specific disease mechanisms can be ignored.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc03","n":3,"group":"Foundational regulation","headline":"Allostasis is predictive regulation; homeostasis remains a nested special case.","body":"Living systems do not only correct error after variables drift. They anticipate needs, set priorities and coordinate effectors before demand fully arrives. Homeostatic feedback remains important within the larger predictive regulatory architecture.","status":"Established foundation","boundary":"Do not present allostasis as merely another word for allostatic load.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc04","n":4,"group":"Foundational regulation","headline":"Health must be evaluated through the sustainability and consequences of regulation, not self-maintenance alone.","body":"Emergent allostasis names the regulatory state arising from a system's architecture in interaction with its conditions; it does not certify that the state is healthy or desirable. A chronically mismatched system may also maintain an emergent allostasis. ESF evaluates health-related functioning through protected bodily functions, recovery, burdens and person-defined participation across specified conditions and timescales, including the supports through which these are sustained.","status":"ESF synthesis","boundary":"Emergent allostasis is a state, not “the capacity to...”. Neither persistence, conformity to a norm, a single capacity score nor independent functioning is sufficient to establish health.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":"2026-10-17"},"published_support":[]},{"id":"pc05","n":5,"group":"Foundational regulation","headline":"Brain-body regulation and energy allocation organize cognition, emotion, perception and behavior.","body":"The brain is embedded in multisystem regulation. Thinking, feeling, attention, movement and action are organized in relation to bodily need, energetic constraints, expected demand and social participation rather than occurring in an isolated cognitive layer.","status":"Strong convergent support","boundary":"Do not reduce regulation to the brain alone; immune, endocrine, metabolic, autonomic and environmental processes are part of the system.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc06","n":6,"group":"Prediction, architecture and diagnosis","headline":"Interoception and predictive processing link bodily state to adaptation.","body":"Organisms generate expectations about internal and external conditions, compare those expectations with incoming signals and update action. Interoception is multidimensional: sensing, interpretation, confidence, meaning and action can diverge.","status":"Strong convergent support","boundary":"Do not universalize one interoceptive deficit or equate laboratory accuracy with everyday regulatory ease.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc07","n":7,"group":"Prediction, architecture and diagnosis","headline":"Neurodevelopmental variation may include architectural heterogeneity, not only parametric variation.","body":"Some people may differ not only in settings of a shared regulatory design but in system organization itself - structure, coupling, functional form, dimensionality or timescale organization. This would produce different robustness-fragility profiles rather than positions on one shared scale.","status":"Active empirical hypothesis","boundary":"This is not established categorical subtyping, a severity ladder or an inference available from diagnosis alone.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc08","n":8,"group":"Prediction, architecture and diagnosis","headline":"Diagnoses generally describe expressed profiles and do not uniquely identify underlying architecture.","body":"Diagnostic categories track recurring outward patterns. Similar profiles can arise through different architectures and histories, and similar architectures can express differently under different current states and environments.","status":"Methodological implication","boundary":"Diagnosis remains clinically useful; the claim is that it is not a complete causal reconstruction.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc09","n":9,"group":"Expression, strategy and trade-offs","headline":"Emergent neurotypes are expressed profiles arising from architecture, calibration, current physiology and context.","body":"Bio-neurotype names regulatory architecture. Calibration is developmental parameter-setting on that architecture. Emergent neurotype names the profile that becomes observable when architecture, calibration, current physiology and present context interact.","status":"ESF synthesis","boundary":"Do not use emergent neurotype as the underlying or “true” type.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc10","n":10,"group":"Expression, strategy and trade-offs","headline":"Some behaviors and physiological responses function as regulatory strategies before or while becoming costly.","body":"Withdrawal, repetition, vigilance, shutdown, conservation or intense focus may sometimes reduce uncertainty, protect energy, limit input or preserve viability. A response can be intelligible and still be impairing, brittle or in need of support.","status":"ESF synthesis","boundary":"Do not assume every symptom is adaptive, intentional or harmless.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc11","n":11,"group":"Expression, strategy and trade-offs","headline":"Strengths and impairments can reflect shared trade-offs; neither cancels the other.","body":"A regulatory architecture may support high performance in some directions while exposing fragility in others. Context changes which side of a trade-off becomes visible, but support needs and suffering remain real.","status":"ESF synthesis","boundary":"Do not promise that every impairment contains a compensating gift or that interventions necessarily remove strengths.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc12","n":12,"group":"Environment and methodology","headline":"Environment is part of coupled regulation and shapes cost, disability and function without explaining everything.","body":"Sensory conditions, communication fit, autonomy, discrimination, relationships, material resources and institutional design can alter physiological demand and recovery. Environment is causal within a coupled system, not a background variable.","status":"Strong convergent support","boundary":"Do not reduce all outcomes to environment or deny embodied constraints and medical illness.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]},{"id":"pc13","n":13,"group":"Environment and methodology","headline":"Regulatory capacity must be studied across demands, context and time, not treated as a universal score.","body":"Before asking how much capacity someone has, ask: capacity for what, under which conditions, at what cost and over what period? Population averages can obscure meaningful differences in response, thresholds, burden and recovery. Regulatory Bandwidth names the organism's present coordinated regulatory capacity across interacting stress-responsive systems. ESF investigates this capacity through response-and-recovery profiles across specified challenges and conditions, alongside population research and comparisons with strong alternative models. Any scalar summary must identify the represented system, challenge, evaluation criterion, protected function or viability endpoint and time horizon.","status":"Methodological implication","boundary":"Population methods and scalar summaries remain useful within justified scopes. Declaring conditions makes a score interpretable, not validated. A response profile does not, by itself, identify regulatory architecture.","published_support":["pub-rb-2026","pub-nas-2026"],"canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":"2026-10-17"}},{"id":"pc14","n":14,"group":"Environment and methodology","headline":"Medicine needs cross-system, longitudinal and architecture-aware explanatory infrastructure.","body":"Specialties provide essential mechanistic depth. ESF argues for a shared regulatory layer that can connect those mechanisms in one person over time, distinguish history from current capacity, and treat environment and relationships as parts of the system.","status":"Methodological implication","boundary":"Integration should supplement rather than replace specialty expertise, diagnosis or causal investigation.","canon":{"record":"10.5281/zenodo.21937705","version":"1.0","revised":null},"published_support":[]}],"topics":[{"id":"c01","legacy_label":"Regulation is predictive, not reactive","legacy_description":"Organisms continuously generate predictions about internal and external states to guide regulation. Stress is a disturbance in predictive regulation, not merely a response to insult.","layer_home":1,"topic_status":"active","proposed_label_v2":"Regulation is predictive as well as reactive: anticipation sets priorities, homeostatic feedback remains nested within it","related_public_claims":[{"claim":"pc03","scope":"predictive regulation; homeostatic feedback retained"},{"claim":"pc06","scope":"where the source is about prediction-error updating"}],"migration_note":"Old label 'predictive, not reactive' read as if prediction excludes reaction; Public Claim 3 explicitly keeps homeostatic feedback."},{"id":"c02","legacy_label":"Health is emergent allostasis, not static equilibrium","legacy_description":"Health is the ongoing achievement of adaptive coordination across changing conditions, not the maintenance of a fixed set-point or the absence of stress.","layer_home":1,"topic_status":"retired","proposed_label_v2":null,"related_public_claims":[{"claim":"pc04","scope":"reassess each source individually"},{"claim":"pc03","scope":"where the source is about allostasis itself"}],"migration_note":"Wording superseded by the revised Public Claim 4 (emergent allostasis does not certify health). Its nine source links are NOT transferred; each is reassessed for PC3 and/or PC4."},{"id":"c03","legacy_label":"Stress is informational calibration, not only damage","legacy_description":"Stress serves an organizational and informational function in biological development. It shapes regulatory style, sensitivity, and adaptive strategy before becoming load.","layer_home":3,"topic_status":"wording_superseded","proposed_label_v2":"Stress is information-bearing adaptive work, not only damage","related_public_claims":[{"claim":"pc01","scope":"stress as adaptive work"},{"claim":"pc09","scope":"only where a source addresses developmental calibration, in the Layer-2 sense"}],"migration_note":"'Calibration' in the old label now names the Layer-2 process; replaced."},{"id":"c04","legacy_label":"Interoception is central to regulation and self-modeling","legacy_description":"The brain's predictive model of the body's internal state is foundational to emotion, cognition, identity, and adaptive behavior -- not peripheral to them.","layer_home":1,"topic_status":"active","proposed_label_v2":null,"related_public_claims":[{"claim":"pc06","scope":"name the interoceptive dimension and outcome each source addresses"}],"migration_note":"Keep; review per source for the specific dimension (sensing, interpretation, confidence, meaning, action)."},{"id":"c05","legacy_label":"Bioenergetics are central to stress adaptation","legacy_description":"Stress is materially instantiated in energy systems. Mitochondria transduce psychosocial signals into cellular energy changes, making stress an energetic as well as psychological phenomenon.","layer_home":2,"topic_status":"active","proposed_label_v2":null,"related_public_claims":[{"claim":"pc05","scope":"energetic constraints on regulation"},{"claim":"pc13","scope":"background only -- energetic models are not RB measurement"}],"migration_note":"Separate energetic-constraint sources from anything presented as RB measurement or validation."},{"id":"c06","legacy_label":"Stress responsivity is developmentally calibrated","legacy_description":"Variation in stress responsivity reflects patterned developmental calibration to local conditions, not simply healthy vs. unhealthy states. Similar stressors can produce divergent adaptive outcomes.","layer_home":3,"topic_status":"wording_superseded","proposed_label_v2":"Stress responsivity is developmentally calibrated on an existing architecture (an analytical, model-relative distinction)","related_public_claims":[{"claim":"pc09","scope":"the calibration component only"}],"migration_note":"Do not infer that development cannot form or reorganise architecture; the distinction is analytical and model-relative (Constitution P5, E3)."},{"id":"c07","legacy_label":"Conditions are network states, not single-cause entities","legacy_description":"Disease and neurodevelopmental conditions emerge from perturbations in interacting biological and social networks. Multimorbidity reflects connected system disturbance, not unrelated coincidence.","layer_home":4,"topic_status":"wording_superseded","proposed_label_v2":"Many health problems can involve interacting regulation under constraint, not isolated pathology alone","related_public_claims":[{"claim":"pc02","scope":"qualified: many / can / may"},{"claim":"pc14","scope":"where the source argues for cross-system integration"}],"migration_note":"The old universal wording ('conditions are network states') is replaced by the public claim's qualified framing."},{"id":"c08","legacy_label":"Autism reflects emergent heterogeneity, not a singular pathology","legacy_description":"Autism cannot be explained by one cause, one mechanism, or one deficit. It is better modeled as an emergent developmental manifold -- a family of regulatory trajectories sharing some attractors.","layer_home":4,"topic_status":"wording_superseded","proposed_label_v2":"Autism is a diagnosis over heterogeneous expressed profiles and histories; whether that heterogeneity is architectural is an open hypothesis","related_public_claims":[{"claim":"pc08","scope":"diagnosis does not uniquely identify architecture"},{"claim":"pc07","scope":"only through separately scoped links; 'may include' preserved"}],"migration_note":"'Emergent developmental manifold' removed (withdrawn manuscript). Diagnostic heterogeneity is kept distinct from demonstrated architectural heterogeneity."},{"id":"c09","legacy_label":"Neurodiversity is contextual and ecological, not merely intrapersonal","legacy_description":"Functional difference cannot be read outside context. Social environments, ecological fit, and organism-niche relationships are part of what makes a trait adaptive, disabling, or somewhere in between.","layer_home":5,"topic_status":"active","proposed_label_v2":null,"related_public_claims":[{"claim":"pc12","scope":"contextual / relational interpretation"},{"claim":"pc11","scope":"where a source is about trade-offs becoming visible in context"}],"migration_note":"Keep; preserve embodied constraints alongside context."},{"id":"c10","legacy_label":"Burnout reflects regulatory depletion and demand-resource mismatch","legacy_description":"Autistic burnout is a regulatory exhaustion state arising from cumulative adaptation cost, masking load, and demand-resource imbalance -- not merely a psychiatric comorbidity.","layer_home":5,"topic_status":"active","proposed_label_v2":"Autistic burnout (application topic): a sustained narrowing of regulatory bandwidth under prolonged demand-resource mismatch; depletion vs transition held open","related_public_claims":[{"claim":"pc04","scope":"evaluation of health through recovery and burden"},{"claim":"pc12","scope":"environmental demand and recovery"},{"claim":"pc13","scope":"measurement across demands, context and time"},{"claim":"pc10","scope":"only for a specific behaviour or response whose regulatory role is addressed"}],"migration_note":"Burnout as a state is not itself a regulatory strategy; it is an application topic linked to several public claims by scope, not a child of PC10."},{"id":"c11","legacy_label":"Cooperative neurodiversity serves population-level function","legacy_description":"Variation in cognition, stress responsivity, and regulatory style may serve a collective adaptive function -- distributed across a population like response diversity in ecological systems.","layer_home":6,"topic_status":"retired","proposed_label_v2":null,"related_public_claims":[{"claim":"sp-cooperative-neurodiversity","scope":"moved to a supplementary proposition"}],"migration_note":"Moved out of the claim layer: cooperative neurodiversity is a supplementary proposition (Terminology Map: active ESF proposition), not a child of Public Claim 7."},{"id":"c12","legacy_label":"Social environments are part of regulatory architecture","legacy_description":"Regulation is not only intrapersonal. Attachment, co-regulation, social buffering, and niche construction are constitutive parts of the regulatory system, not external supports.","layer_home":5,"topic_status":"wording_superseded","proposed_label_v2":"Social environments are part of coupled regulation; co-regulation distributes regulatory labour across people and settings","related_public_claims":[{"claim":"pc12","scope":"environment as part of coupled regulation"}],"migration_note":"'Architecture' is reserved for the person's control system (bio-neurotype). Other authors' own terminology stays in source summaries; ESF terms belong in the interpretation field."},{"id":"c13","legacy_label":"Sensitivity is bidirectional, not only vulnerability","legacy_description":"Higher environmental sensitivity can confer greater benefit under supportive conditions as well as greater cost under adverse ones. Vulnerability and potential are linked, not separable.","layer_home":3,"topic_status":"active","proposed_label_v2":null,"related_public_claims":[{"claim":"pc11","scope":"trade-offs; context changes which side is visible"},{"claim":"pc09","scope":"developmental component where justified"}],"migration_note":"Do not infer that every impairment carries an advantage or that differential susceptibility proves architectural difference."},{"id":"c14","legacy_label":"Organisms co-construct their regulatory niches","legacy_description":"Organisms do not merely adapt to environments; they actively shape the environments that make their own regulation possible. Niche construction is part of adaptive strategy.","layer_home":6,"topic_status":"active","proposed_label_v2":null,"related_public_claims":[{"claim":"pc12","scope":"niche construction / person-environment fit, with scale marked"}],"migration_note":"Niche construction alone does not establish ESF-specific cooperative benefits; mark the scale and kind of contribution."}],"supplementary_propositions":[{"id":"sp-cooperative-neurodiversity","label":"Cooperative neurodiversity","definition":"Differing regulatory architectures coupled so that collective regulatory and epistemic capacity exceeds what one architecture achieves alone. (ESF Canonical Terminology and Boundary Map v1.0)","status":"Active ESF proposition (Terminology Map); not among the 14 Public Claims","boundary":"Never a reason to instrumentalise people or make inclusion contingent on productivity. Sequencing: fit is prerequisite to cooperation and is never traded against it. Not the portfolio account (response diversity / distributed vulnerability).","related_public_claims":[{"claim":"pc07","scope":"different architectures as the premise of coupling"},{"claim":"pc11","scope":"trade-offs across architectures"},{"claim":"pc12","scope":"coupled regulation across people"}],"from_legacy":"c11"}],"sources":[{"id":"barrett-simmons-2015","layer":1,"annotated":true,"citation":"Barrett & Simmons (2015)","full":"Barrett, Lisa Feldman, and W. Kyle Simmons. 2015. Interoceptive Predictions in the Brain. Nature Reviews Neuroscience 16(7): 419-29.","doi":"10.1038/nrn3950","tags":["INT","PP","REG","EN"],"argues":"The brain continuously generates predictions about internal bodily states and uses these to guide regulation. Interoception is not passive sensation but part of an anticipatory control architecture tied to action, feeling, and bodily need.","esf":"One of the clearest anchors for the ESF claim that the organism is not primarily a thinking machine but a predictive regulatory system. Supports the view that cognition, affect, and bodily regulation are integrated rather than separable domains.","supports":["The brain is fundamentally engaged in predictive allostatic regulation","Interoception is central to experience, not secondary to cognition","Stress can be analyzed as a disturbance in predictive regulation"],"limits":"Theoretical and neuroscientific; does not by itself establish how these mechanisms vary across neurotypes or developmental histories.","next":"Build ESF arguments about emotion, uncertainty, and regulation. Link interoception to autism heterogeneity, burnout, and stress sensitivity. Foundational citation for introductions and conceptual papers.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c01"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c02"}],"claim_links":[{"claim":"pc06","relation":"supports","scope":"the EPIC account of interoceptive prediction and visceromotor regulation (conceptual proposal, not direct experimental validation)","rationale":"Names the Embodied Predictive Interoception Coding proposal rather than presenting its whole mechanism as established.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc03","relation":"supports","scope":"predictive regulation of the body as proposed in the EPIC account","rationale":"Component only; conceptual.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc05","relation":"supports","scope":"interoceptive prediction organising affect and action around bodily need (conceptual)","rationale":"Component only; conceptual.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"mcewen-wingfield-2003","layer":1,"annotated":true,"citation":"McEwen & Wingfield (2003)","full":"McEwen, Bruce S., and John C. Wingfield. 2003. The Concept of Allostasis in Biology and Biomedicine. Hormones and Behavior 43(1): 2-15.","doi":"10.1016/s0018-506x(02)00024-7","tags":["REG","STR","EN","EVO"],"argues":"Introduces allostasis as regulatory stability through change -- the organism actively anticipates and responds to demand rather than passively restoring equilibrium. Distinguishes allostasis from homeostasis.","esf":"The definitional foundation for ESF's regulatory language. Reframes stress as adaptive engagement with demand rather than deviation from a fixed normal state. Health is dynamic regulation under changing conditions, not mere maintenance of an average set point.","supports":["Health is adaptive regulation, not static equilibrium","Stress physiology is part of normal biological design, not only pathology","Trade-offs are inherent to adaptation"],"limits":"Opens the door to a broader framework but does not fully integrate interoception, predictive processing, or neurodiversity.","next":"Use as foundational citation in any ESF introduction. Pair with Sterling, Barrett, and Picard to show the evolution from allostasis to predictive embodied regulation.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c02"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c01"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c03"}],"claim_links":[{"claim":"pc03","relation":"supports","scope":"allostasis as stability through change across predictable and unpredictable challenges","rationale":"Definitional contribution. The 'homeostasis as nested special case' wording is ESF's; cite the source for the allostasis/homeostasis distinction, not for that phrasing.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc01","relation":"supports","scope":"stress as part of normal adaptive design, with cost when prolonged (allostatic load)","rationale":"Frames mediators of stress as adaptive and as the source of load when overused -- both halves of Public Claim 1.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc04","relation":"supports","scope":"consequences and time-dependence of regulation: protective effects become damaging during sustained allostatic activity","rationale":"The Protection vs damage section and the overload discussion bear directly on evaluating regulatory consequences; they do not establish every part of Public Claim 4.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc10","relation":"supports","scope":"physiological mediators can protect in the short term and damage over longer intervals","rationale":"The Protection vs damage section addresses both regulatory function and time-dependent burden of the mediators themselves -- the physiological-response component of Public Claim 10. Conceptual/physiological synthesis, not evidence about any particular behaviour.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Protection vs damage section"}],"modules":[]},{"id":"sterling-2012","layer":1,"annotated":true,"citation":"Sterling (2012)","full":"Sterling, Peter. 2012. Allostasis: A Model of Predictive Regulation. Physiology & Behavior 106(1): 5-15.","doi":"10.1016/j.physbeh.2011.06.004","tags":["REG","PP","INT","EN"],"argues":"Reframes allostasis explicitly as predictive regulation. The organism anticipates need and allocates resources prospectively rather than waiting passively for error correction.","esf":"Essential for the ESF argument that stress is not just a response to insult but part of the organism's continuous effort to manage uncertainty, need, opportunity, and cost. Helps prevent the framework from being interpreted as reactive damage science.","supports":["Regulation is predictive","Organisms are designed around energetic anticipation","Stress belongs inside a broader regulatory model"],"limits":"Gives a strong conceptual basis, but ESF still needs additional layers to address development, heterogeneity, and condition-specific trajectories.","next":"Stronger framing of emergent allostasis. Better articulation of why prediction matters more than average norms.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c01"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c02"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c03"}],"claim_links":[{"claim":"pc03","relation":"supports","scope":"allostasis as predictive regulation","rationale":"The paper's explicit thesis.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc05","relation":"supports","scope":"energy allocation and anticipation organise the brain's regulatory work","rationale":"Sterling's model centres prospective allocation of energy and effectors.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc01","relation":"supports","scope":"stress responses as part of prospective regulation, costly when sustained","rationale":"Sterling treats stress responses inside the allostatic logic of prediction and prospective allocation.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc04","relation":"supports","scope":"health evaluated through adaptive response range and reversibility when predictions change","rationale":"The paper's 'What is health?' section evaluates health by predictive fluctuation, response range, and whether effector adaptation reverses when the prediction changes; it also names unhealthy persistence of adaptation. Component support, not identity with the full ESF definition (person-defined participation is ESF's).","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","review_note":"Earlier rationale ('does not supply health criteria') was factually wrong."},{"claim":"pc10","relation":"supports","scope":"anticipatory behaviour can conserve energy or other resources before a physiological deviation becomes large","rationale":"The author's anticipatory-behaviour examples support the functional component only; not every costly response is protective.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Abstract and anticipatory-behaviour examples"}],"modules":[]},{"id":"friston-2010","layer":1,"annotated":true,"citation":"Friston (2010)","full":"Friston, Karl. 2010. The Free-Energy Principle: A Unified Brain Theory? Nature Reviews Neuroscience 11(2): 127-38.","doi":"10.1038/nrn2787","tags":["PP","REG","EN"],"argues":"Biological systems minimize surprise (free energy) by either updating their models of the world or acting to make the world match their predictions. Unifies perception, action, and learning under a single framework.","esf":"Provides formal theoretical grounding for the ESF view that organisms are model-based predictive regulators. Active inference extends this to behavior, stress responses, and development.","supports":["Organisms are self-organizing prediction systems","Stress represents unresolved prediction error under energetic constraint"],"limits":"Highly mathematical; requires ESF translation for clinical and advocacy audiences.","next":"Link active inference to interoception, autistic perception, and burnout models.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Auto-check tripped on the '?' in the title; record matches.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c01"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"}],"claim_links":[{"claim":"pc06","relation":"supports","scope":"prediction-error minimisation as the general form of perception-action coupling","rationale":"Free-energy principle: organisms update models or act to make predictions true; the formal basis for predictive processing.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc03","relation":"background","scope":"formal grounding for prediction-first regulation","rationale":"Foundational theory, not a physiological account of allostasis; background for Public Claim 3.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"quigley-2021","layer":1,"annotated":true,"citation":"Quigley et al. (2021)","full":"Quigley, Karen S., Scott Kanoski, Warren M. Grill, Lisa Feldman Barrett, and Manos Tsakiris. 2021. Functions of Interoception: From Energy Regulation to Experience of the Self. Trends in Neurosciences 44(1): 29-38.","doi":"10.1016/j.tins.2020.09.008","tags":["INT","EN","REG","SOC"],"argues":"Broadens interoception beyond sensing internal signals -- it plays roles in energy regulation, motivation, emotion, selfhood, and social functioning. Interoception is a multi-level integrative function, not a single sensory channel.","esf":"Helps translate interoception from a niche topic into a central organizing principle. Supports ESF's effort to connect body regulation, identity, affect, and adaptive behavior without splitting them into separate silos.","supports":["Interoception is foundational to self and regulation","Energy management and subjective experience are linked","Social and emotional life are inseparable from body-state modeling"],"limits":"Integrative framing benefits from pairing with disorder- or phenotype-specific literature when making clinical claims.","next":"Stronger ESF language around identity, coherence, and self-trust. Bridges to autistic burnout and timing/predictability work.","aliases":[],"related_versions":[],"evidence_type":"review","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c02"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c12"}],"claim_links":[{"claim":"pc06","relation":"supports","scope":"interoception as multidimensional and integrative (energy regulation, emotion, self, social)","rationale":"Review's main claim: interoception is a multi-level function, not one sensory channel -- matches the claim's 'multidimensional' wording.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc05","relation":"supports","scope":"energy regulation as the organising function of interoception","rationale":"The review ties interoception to energy regulation and motivation.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc12","relation":"background","scope":"social functioning as part of body-state modelling","rationale":"Mentions social roles of interoception; not an environment-as-coupled-regulation argument.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"kleckner-2017","layer":1,"annotated":true,"citation":"Kleckner et al. (2017)","full":"Kleckner, Ian R., et al. 2017. Evidence for a Large-Scale Brain System Supporting Allostasis and Interoception in Humans. Nature Human Behaviour 1(5): 0069.","doi":"10.1038/s41562-017-0069","tags":["INT","REG","NET","EN"],"argues":"Presents evidence for a large-scale neural system integrating allostasis and interoception. Rather than localized functions, regulation emerges through distributed networks linking bodily prediction and coordinated action.","esf":"Strengthens ESF neuroanatomically. ESF argues that regulation is distributed and integrated, and this paper provides concrete support for that claim at the network level.","supports":["Allostasis and interoception depend on distributed brain-body networks","Regulation is a systems phenomenon, not a single-region function","Neural organization reflects energetic priorities"],"limits":"Network framing is highly useful but translation to lived heterogeneity requires additional developmental and ecological layers.","next":"Stronger diagrams of allostatic-interoceptive network organization. Better support for claims about autism as network-level difference rather than isolated deficit.","aliases":[],"related_versions":[],"evidence_type":"empirical study","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c01"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c07"}],"claim_links":[{"claim":"pc05","relation":"supports","scope":"distributed brain system supporting allostasis and interoception","rationale":"Empirical: a large-scale network integrating allostasis and interoception; regulation is distributed, not localised.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc06","relation":"supports","scope":"neural basis for interoceptive prediction","rationale":"Same evidence read for the interoception claim.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc02","relation":"background","scope":"regulation as a systems phenomenon","rationale":"Topical background for the 'regulation under constraint' framing; the paper is not about health problems.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"picard-en-2018","layer":1,"annotated":true,"citation":"Picard, McEwen, Epel & Sandi (2018)","full":"Picard, Martin, Bruce S. McEwen, Elissa S. Epel, and Carmen Sandi. 2018. An Energetic View of Stress: Focus on Mitochondria. Frontiers in Neuroendocrinology 49: 72-85.","doi":"10.1016/j.yfrne.2018.01.001","tags":["STR","EN","REG","CLIN"],"argues":"Reframes stress in explicitly energetic terms, with mitochondria as central mediators of adaptation and cost. Connects psychological, neural, endocrine, and cellular domains through bioenergetic logic.","esf":"One of the most important papers for making ESF biologically legible to skeptics. Shows that energy is not metaphorical but materially embedded in regulatory systems.","supports":["Stress is an energetic process","Bioenergetics are central to adaptation, not a downstream footnote","Chronic dysregulation can be understood as accumulated energetic cost"],"limits":"As with many integrative papers, direct phenotype-specific conclusions require supplemental studies.","next":"Mechanistic support for ESF discussions of fatigue, burnout, and multimorbidity. Strong bridge to autism metabolism and mitochondrial literature.","aliases":[],"related_versions":[],"evidence_type":"review","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c05"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c02"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c03"}],"claim_links":[{"claim":"pc05","relation":"supports","scope":"energy allocation and mitochondria as central to stress regulation","rationale":"Review's thesis: stress is energetic; mitochondria mediate adaptation and cost.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc01","relation":"supports","scope":"stress as adaptive work that becomes costly when prolonged","rationale":"Energetic framing of both the adaptive and the costly face of stress.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc13","relation":"background","scope":"energetic constraints as context for capacity measurement","rationale":"Background only; the paper does not measure regulatory capacity.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"sturmberg-2019","layer":1,"annotated":true,"citation":"Sturmberg et al. (2019)","full":"Sturmberg, Joachim P., et al. 2019. Health and Disease -- Emergent States Resulting from Adaptive Social and Biological Network Interactions. Frontiers in Medicine 6: 59.","doi":"10.3389/fmed.2019.00059","tags":["NET","REG","SOC","CLIN"],"argues":"Models health and disease as emergent states arising from adaptive social and biological network interactions. Challenges simple biomedical reductionism and emphasizes dynamic state organization.","esf":"One of the most direct complexity-medicine allies for ESF. Supports the idea that disease is not a thing the organism has but a system state the organism enters.","supports":["Health and disease are emergent adaptive states","Social and biological levels must be modeled together","Static normal-vs-pathological binaries are insufficient"],"limits":"Framework is highly compatible with ESF, but ESF adds more explicit emphasis on neurodiversity and stress-language integration.","next":"Direct support for emergent-allostasis language. Better bridges ism: A Narrative Review of Behavioral and Neurobiological Data. Psychology Research and Behavior Management 17: 1841-53.","doi":"10.2147/PRBM.S410605","tags":["INT","ND","NET","CLIN"],"argues":"Updates the interoception-in-autism literature by integrating behavioral and neurobiological data. Reinforces heterogeneity and highlights the difficulty of drawing singular conclusions across studies using different tasks and definitions.","esf":"Helps ESF stay current while supporting the claim that autism research often struggles because it is trying to force nonlinear diversity into linear summary categories.","supports":["Autism heterogeneity appears clearly in interoceptive findings","Interoception should be studied across multiple levels, not as a single trait","Better models are needed to explain diverse regulatory profiles"],"limits":"Narrative reviews need to be paired with specific mechanistic and ecological studies.","next":"Stronger literature reviews in ESF writing. Better justification for multidimensional interoceptive frameworks.","aliases":[],"full_v1":"Loureiro, F., S. M. Ringold, and L. Aziz-Zadeh. 2024. Interoception in Autism: A Narrative Review of Behavioral and Neurobiological Data. Frontiers in Psychology 15: 1369005.","related_versions":[],"evidence_type":"review","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"WRONG JOURNAL in v1.0 (gave Frontiers in Psychology 15: 1369005). Published in Psychology Research and Behavior Management 17: 1841-1853. Author names as in the Crossref record (v1.0 had initials only).","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"},{"review_status":"history (reasses  and measured accuracy do not always align neatly.","esf":"Supports a core ESF point: lived regulation cannot be inferred from a single metric. A person may perform one task adequately while still experiencing substantial regulatory friction in daily life.","supports":["Subjective and objective regulation measures can diverge","Daily lived difficulty matters as much as task performance","Autism research needs multi-level assessment"],"limits":"Heartbeat tasks capture only one narrow part of interoception and should not be overgeneralized.","next":"Better ESF justification for combining biomarkers, EMA, and self-report. A stronger bridge between lab measures and real-world regulation.","aliases":[],"full_v1":"Itoi, Chihiro, Yuta Ujiie, Yuuki Ooishi, and Makio Kashino. 2024. The Relationship between Subjective Difficulty in Interoceptive Processing and Accuracy of Heartbeat Perception in Autistic Individuals. Autism Research 17(4): 703-15.","related_versions":[],"evidence_type":"empirical study","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"WRONG JOURNAL in v1.0 (gave Autism Research 17(4): 703-15). Published in Discover Mental Health 4(1): article 13 (2024).","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c04"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c08"}],"claim_links":[{"claim":"pc13","relation":"refines","scope":"no significant association between subjective interoceptive difficulty and heartbeat-counting accuracy in this sample; the measures address different aspects","rationale":"A non-significant correlation is not proof of independence. The authors discuss task and construct specificity; applying that to RB is an ESF methodological extension.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc06","relation":"supports","scope":"subjective difficulty and heartbeat-counting accuracy address different aspects of interoception (one sample, one task)","rationale":"Empirical; the null association is reported as such.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc08","relation":"background","scope":"felt difficulty is not captured by one task measure","rationale":"Background.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"mahony-2022","layer":2,"annotated":true,"citation":"Mahony & O'Ryan (2022)","full":"Mahony, Caitlyn, and Colleen O'Ryan. 2022. A Molecular Framework for Autistic Experiences: Mitochondrial Allostatic Load as a Mediator between Autism and Psychopathology. Frontiers in Psychiatry 13: 985713.","doi":"10.3389/fpsyt.2022.985713","tags":["EN","STR","ND","NET","CLIN"],"argues":"Proposes mitochondrial allostatic load as a mechanism linking autistic experience and psychopathology. Offers a bioenergetic interpretation for why autistic individuals may face elevated downstream mental and physical health burdens under chronic stress.","esf":"Closely aligned with ESF: proposes a mechanistic bridge from lived autistic stress burden to cellular energy cost, which would help explain why autistic distress often becomes distributed across multiple domains. The mediation is proposed, not tested; the framework's value for ESF is as a candidate mechanism to be examined against multimorbidity and developmental data.","supports":["Autistic stress burden may be biologically embodied through bioenergetic cost","Psychopathology and physical burden may share energetic pathways","Mitochondrial allostatic load can connect neurodiversity and health inequity"],"limits":"A conceptual framework: the mediating role of mitochondrial allostatic load is proposed, not demonstrated. Needs empirical integration with multimorbidity and developmental data before any of its 'may' statements can be strengthened.","next":"One of the strongest mechanistic subsections for ESF autism papers. A direct bridge between autism, burnout, chronic illness, and stress biology.","aliases":[],"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","full_v1":"Mahony, Caitlyn, and Colleen O'Ryan. 2022. A Molecular Framework for Autistic Experiences: Mitochondrial Allostatic Load as a Mediator between Autism and Psychopathology. Frontiers in Psychiatry 13: 752210.","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"Article number corrected: v1.0 gave 752210; the DOI and publisher record are 985713 (Frontiers records carry an article number, not a page field). Author names re-checked against Crossref on 26 Oct 2026: Caitlyn Mahony, as in v1.0 (an interim draft had this wrong).","annotation":"revised","annotation_note":"Revised 26 Oct 2026: conceptual framework (mitochondrial allostatic load as a proposed mediator); 'supports' lines kept in their hedged form; evidence type conceptual model.","links":"drafted (awaiting review)","annotation_revised":"2026-10-26"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c05"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c10"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Not about diagnosis or heterogeneity. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c0
