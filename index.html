l-population Quan index (AUC 0.872 vs 0.828; pseudo-R2 0.25 vs 0.20). The authors caution that morbidity burden in autistic adults is still poorly understood.","esf":"A worked example of condition-specific measurement: an index built for a declared population and outcome outperformed a general one for that outcome. ESF reads this as an illustration of Public Claim 13 (declare the population, outcome and horizon before reporting a score), not as a validation of multisystem regulatory coupling or of an all-purpose autistic-health index.","supports":["A general-population multimorbidity index can underperform a population-specific one for a specified outcome (COVID-19 mortality among hospitalised autistic adults)","Measurement tools for autistic health need population-specific design and justified scope"],"limits":"One outcome (COVID-19 mortality), one hospitalised cohort, three predictors; the authors call for refinement. Not evidence about regulatory mechanism, and not a test of regulatory capacity.","next":"Design template for scoped, outcome-specific indices within an evidence-ecology approach; a teaching example for 'a score is interpretable only within its declared conditions'.","aliases":["sosenko-2024"],"full_v1":"Sosenko, Filip, et al. 2024. Making a Case for an Autism-Specific Multimorbidity Index: A Comparative Cohort Study. EClinicalMedicine 71: 102589.","related_versions":[{"kind":"preprint","doi":"10.1101/2024.02.23.24303273","note":"medRxiv 2024, Sosenko first author; earlier version of the same study"}],"evidence_type":"empirical study","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"v1.0 cited a non-existent EClinicalMedicine 71: 102589 under the preprint's first author (Sosenko et al. 2024, medRxiv 10.1101/2024.02.23.24303273). The peer-reviewed version is Nijhof et al., Journal of Autism and Developmental Disorders, online 16 May 2025, issue 56(11): 4429-4437; Crossref record checked 26 Oct 2026.","annotation":"revised","annotation_note":"Revised 26 Oct 2026 against the published JADD abstract: the study is an index comparison for COVID-19 mortality among hospitalised autistic adults, not a general multimorbidity-index argument. Index-performance figures (AUC 0.872 vs 0.828) verified against the abstract.","links":"drafted (awaiting review)","annotation_revised":"2026-10-26"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c07"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Not about diagnosis identifying architecture. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c08"}],"claim_links":[{"claim":"pc13","relation":"refines","scope":"an outcome- and population-specific index-comparison example (COVID-19 mortality among hospitalised autistic adults); not a test of generic regulatory capacity","rationale":"ESF lesson stated as interpretation. Index-performance claim verified against the published abstract on 26 Oct 2026 (ASD-MI AUC 0.872 vs Quan 0.828 for COVID-19 mortality among 1,027 hospitalised autistic adults).","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc02","relation":"background","scope":"patterned multimorbidity in autistic adults","rationale":"Background; the study's aim is index comparison.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc14","relation":"background","scope":"need for population-specific measurement logic","rationale":"Background.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[],"argues_v1":"Argues for an autism-specific multimorbidity index, recognizing that existing approaches inadequately capture the patterned health burden experienced by autistic populations.","esf_v1":"One of the clearest practical allies for ESF. Acknowledges that autism-related health burden is patterned, systemic, and poorly described by existing medical categories.","supports_v1":["Autism multimorbidity needs its own systems-aware measurement logic","Standard indexes underrepresent patterned autistic health complexity","Better models must integrate diverse health dimensions"],"limits_v1":"Measurement tools still need mechanistic grounding and neurodiversity-sensitive interpretation.","next_v1":"An ESF multimorbidity map or index concept. Better clinical translation of autism as organism-level heterogeneity."},{"id":"miot-2023","layer":4,"annotated":true,"citation":"Miot et al. (2023)","full":"Miot, Stéphanie, Raphaël Chancel, Marianne Peries, et al. 2023. Multimorbidity Patterns and Subgroups among Autistic Adults with Intellectual Disability: Results from the EFAAR Study. Autism 27(3): 762-77.","doi":"10.1177/13623613221121623","tags":["ND","NET","CLIN"],"argues":"Baseline data from an exploratory multicentric cohort of 63 autistic adults with intellectual disability (EFAAR study). Multimorbidity was present in 84.1% and rose with age; clustering identified a dominant pattern combining immune, gastrointestinal, neurological and joint conditions, and four participant subgroups distinguished by multimorbidity, autonomy and polypharmacy.","esf":"Reports that chronic conditions cluster in patterned subgroups rather than appearing at random in this cohort. ESF reads patterned clustering as a motivation for an interacting-regulation account of multimorbidity; the study itself shows association and clustering at one time point, not within-person coupling or a validated clustering mechanism.","supports":["Health burden in this cohort clusters into a patterned subgroup structure rather than appearing randomly","Heterogeneity is structured and subgrouping is informative for care and research"],"limits":"Small single-country cohort (n = 63), cross-sectional baseline data, autistic adults with intellectual disability only; subgroup findings need replication and careful interpretation across populations and support contexts.","next":"Motivates, without establishing, an ESF account of patterned multimorbidity; a candidate for the Clustering review's evidence base once distinguished from within-person coupling claims.","aliases":[],"full_v1":"Miot, S., et al. 2023. Multimorbidity Patterns and Subgroups among Autistic Adults with Intellectual Disability: Results from the EFAAR Study. Frontiers in Psychiatry 14: 1114760.","related_versions":[],"evidence_type":"empirical study","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"WRONG JOURNAL in v1.0 (gave Frontiers in Psychiatry 14: 1114760). Published in Autism 27(3): 762-777. Crossref 'issued' year is 2022 (online-first); the map cites the issue year, which is correct.","annotation":"revised","annotation_note":"Revised 26 Oct 2026 against the published abstract (Autism 27(3): 762-777). Association and clustering kept distinct from an ESF mechanism of coupling.","links":"drafted (awaiting review)","annotation_revised":"2026-10-26"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c07"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c08"}],"claim_links":[{"claim":"pc02","relation":"background","scope":"reported multimorbidity subgrouping motivates an interacting-regulation hypothesis","rationale":"Statistical clustering is a pattern to explain; it does not show within-person coupling or rule out shared exposures.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc08","relation":"supports","scope":"heterogeneity of expression only: a diagnosis is compatible with variation in multimorbidity patterns","rationale":"Supports heterogeneity of the expressed profile; it does not establish different architectures or an inverse-model non-identifiability result.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc14","relation":"background","scope":"subgrouping as a methodological need","rationale":"Background.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[],"argues_v1":"Identifies multimorbidity patterns and subgroups among autistic adults with intellectual disability, showing that health burden clusters rather than appearing randomly.","esf_v1":"Supports one of the framework's strongest claims: chronic conditions often cluster in patterned ways because they are expressions of interacting system states rather than isolated accidents.","supports_v1":["Autistic health burden clusters into patterned subgroup structure","Heterogeneity is structured, not noise","Subgrouping is important for useful science"],"limits_v1":"Subgroup findings need careful interpretation across populations and support contexts.","next_v1":"Better ESF subgroup arguments. A basis for showing autism as manifold rather than singular spectrum."},{"id":"kauffman-1993","layer":4,"annotated":false,"citation":"Kauffman (1993)","full":"Kauffman, Stuart A. 1993. The Origins of Order: Self-Organization and Selection in Evolution. Oxford University Press.","doi":"10.1093/oso/9780195079517.001.0001","tags":["NET","EVO"],"argues":"Complex systems spontaneously generate order through self-organization -- the laws of complexity contribute to biological form and function alongside natural selection.","esf":"Foundational for ESF's claim that neurodevelopmental patterns are not solely selected for but emerge from the dynamics of self-organizing regulatory systems.","supports":["Self-organization generates biological complexity independently of selection","Order emerges from the system, not only from design or selection"],"limits":"Abstract theoretical; requires translation to specific neurodevelopmental contexts.","next":"Cite in theoretical framing sections. Use as part of complexity evolution foundation alongside Jablonka & Lamb.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Monograph; Oxford University Press record. v1.0 citation stands.","annotation":"unannotated","annotation_note":"No annotation in v1.0.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c07"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: The c11 link asserted more than lineage; retained only as background to the supplementary proposition. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c11"}],"claim_links":[{"claim":"pc02","relation":"background","scope":"self-organisation as a source of biological order (foundational theory)","rationale":"Abstract foundation for emergence; background, not evidence about health.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"sp-cooperative-neurodiversity","relation":"background","scope":"self-organisation as lineage for the coupling idea","rationale":"Lineage only; nothing in the book is about cooperative neurodiversity.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"chapman-2021","layer":5,"annotated":true,"citation":"Chapman (2021)","full":"Chapman, Robert. 2021. Neurodiversity and the Social Ecology of Mental Functions. Perspectives on Psychological Science 16(6): 1360-72.","doi":"10.1177/1745691620959833","tags":["ND","SOC","EVO","METH"],"argues":"Mental functions should be understood in social-ecological context. Neurodiversity is not merely individual variation but part of a broader ecology of minds. Critiques deficit framings and emphasizes context, function, and distributed contribution.","esf":"Aligns well with ESF's emphasis on niche, context, trade-offs, and cooperative variation. Helps ensure ESF remains diversity-affirming while remaining scientifically ambitious.","supports":["Neurodiversity is contextual and ecological, not merely intrapersonal","Functional difference cannot be reduced to deficit","Social environments are part of regulatory architecture"],"limits":"Conceptually strong but less mechanistic than some ESF audiences may want; pair with allostasis and systems biology papers.","next":"Stronger neurodiversity-affirming framing in all ESF outputs. Bridge between social model insights and systems biology. Better articulation of cooperative neurodiversity.","aliases":[],"related_versions":[],"evidence_type":"methodological critique","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c09"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Moved to the supplementary proposition; not a Public Claim 7 link. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c11"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c12"}],"claim_links":[{"claim":"pc12","relation":"supports","scope":"mental functions understood in social-ecological context; environment as part of the system","rationale":"The paper's thesis.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc11","relation":"supports","scope":"function and dysfunction as context-relative, not intrinsic deficit","rationale":"Supports the trade-off/context component.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"sp-cooperative-neurodiversity","relation":"supports","scope":"distributed contribution across an ecology of minds","rationale":"Chapman's ecological functionalism is close kin to the cooperative proposition; supports the idea of collective function, with the Map's coupling-not-portfolio boundary stated.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"botha-2024","layer":5,"annotated":true,"citation":"Botha et al. (2024)","full":"Botha, Monique, Robert Chapman, Morénike Giwa Onaiwu, Steven K. Kapp, Abs Stannard Ashley, and Nick Walker. 2024. The Neurodiversity Concept Was Developed Collectively: An Overdue Correction on the Origins of Neurodiversity Theory. Autism 28(6): 1591-94.","doi":"10.1177/13623613241237871","tags":["ND","METH","SOC"],"argues":"Corrects the historical record -- neurodiversity theory was developed collectively by autistic people rather than attributed to a single originator. Emphasizes community ownership and epistemic justice.","esf":"Grounds ESF in the actual origins and meaning of neurodiversity. Essential for ethical framing -- scientific reframing must remain accountable to lived-experience traditions.","supports":["Neurodiversity is a collective conceptual development","Scientific reframing must remain accountable to lived-experience traditions","Historical accuracy matters for paradigm building"],"limits":"Primarily historical correction; connect to theoretical and empirical work for full integration.","next":"Cite in all ESF introductions that discuss neurodiversity origins. Better framing against appropriation or neurodiversity-lite narratives.","aliases":[],"full_v1":"Botha, Monique, Robert Chapman, Morénike Giwa Onaiwu, Steven K. Kapp, Abs Stannard Ashley, and Nick Walker. 2024. The Neurodiversity Concept Was Developed Collectively. Autism 28(6): 1591-94.","related_versions":[],"evidence_type":"methodological critique","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"Subtitle missing in v1.0.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"Topic relevance retained (contextual neurodiversity); conceptual contribution is support, not a reason to demote.","topic_relevance":"keep","v1_topic":"c09"}],"claim_links":[{"claim":"pc12","relation":"background","scope":"community ownership of the neurodiversity concept","rationale":"Historical correction; background for the relational/environmental claim.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc14","relation":"background","scope":"accountability of scientific reframing to lived-experience traditions","rationale":"Background for how integration should be done.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"milton-2012","layer":5,"annotated":true,"citation":"Milton (2012)","full":"Milton, Damian E. M. 2012. On the Ontological Status of Autism: The Double Empathy Problem. Disability & Society 27(6): 883-87.","doi":"10.1080/09687599.2012.710008","tags":["ND","SOC","METH"],"argues":"Social difficulties in autism are not unilateral deficits but bidirectional mismatches between different types of minds. The problem is relational, not intrinsic.","esf":"Essential for protecting ESF from deficit interpretations of social difference. Helps frame relational strain as emergent mismatch across differently organized systems rather than one-sided impairment.","supports":["Social disability is relational, not only individual","Misattunement can arise from differences in predictive and communicative style","Context matters for reading social function"],"limits":"Not a biological account, so it should be integrated with interoceptive and stress-regulation work rather than treated as sufficient on its own.","next":"Stronger ESF discussions of double empathy, niche fit, and cooperative neurodiversity. Better reframing of social functioning outcomes.","aliases":[],"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c09"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c12"}],"claim_links":[{"claim":"pc12","relation":"supports","scope":"double empathy: social difficulty as bidirectional mismatch between minds, i.e. relational","rationale":"The paper's thesis; environment (other minds) as causal within a coupled system.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc08","relation":"supports","scope":"a social 'deficit' read from the profile does not identify an intrinsic cause","rationale":"Supports the diagnosis-as-expressed-profile logic for the social domain.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc06","relation":"background","scope":"differences in predictive and communicative style","rationale":"Background; not a biological account.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"raymaker-2020","layer":5,"annotated":true,"citation":"Raymaker et al. (2020)","full":"Raymaker, Dora M., et al. 2020. \"Having All of Your Internal Resources Exhausted Beyond Measure and Being Left with No Clean-Up Crew\": Defining Autistic Burnout. Autism in Adulthood 2(2): 132-43.","doi":"10.1089/aut.2019.0079","tags":["ND","REG","CLIN","SOC"],"argues":"Community-based participatory research defining autistic burnout as a distinct state resulting from chronic masking and social-regulatory overload -- distinct from depression and clinical burnout. Characterizes burnout as chronic exhaustion, reduced functioning, and loss of skills resulting from life stress and mismatch between demands and available resources.","esf":"Indispensable for translating ESF into human terms. Provides lived-experience evidence that autistic distress often reflects regulatory depletion, demand-resource mismatch, and prolonged adaptation cost rather than simple psychiatric comorbidity.","supports":["Burnout is a regulatory exhaustion state","Functioning loss can emerge from cumulative demand-resource imbalance","Lived experience is essential to accurate mechanistic framing"],"limits":"Conceptual and participatory paper, not a biomarker study. Its strength is definitional and ecological.","next":"Strong ESF discussions of bandwidth, depletion, and adaptive cost. Bridges between autistic community knowledge and formal systems theory.","aliases":[],"full_v1":"Raymaker, Dora M., et al. 2020. Having All of Your Internal Resources Exhausted beyond Measure: Defining Autistic Burnout. Autism in Adulthood 2(2): 132-43.","related_versions":[],"evidence_type":"lived-experience evidence","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"corrected","metadata_note":"Title truncated in v1.0 (the quoted participant phrase is longer).","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c10"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c12"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c09"}],"claim_links":[{"claim":"pc12","relation":"supports","scope":"participants' accounts relate burnout to sustained demands, expectations and insufficient support (qualitative, participatory)","rationale":"Lived-experience evidence counts as evidence (Constitution 5.5); the design does not identify physiological mechanism.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc04","relation":"supports","scope":"loss of function and skills as consequences to be evaluated, not persistence","rationale":"Supports evaluating health through consequences and recovery.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"p road deficit accounts.","esf":"Monotropism fits naturally with ESF because it can be read as a patterned energy-allocation and salience-distribution strategy. Helps reframe autism as a distinctive regulatory style rather than broken general cognition.","supports":["Attention reflects patterned allocation, not simple impairment","Autistic cognition may follow different salience and energy priorities","Traits and trade-offs are better models than deficits"],"limits":"Highly useful conceptually but should be paired with empirical work on stress, sensory processing, and ecological demands.","next":"Better ESF treatment of autistic focus, overload, and burnout. Stronger translation for autistic lived experience.","aliases":[],"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c09"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Not an interoception paper. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c04"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c08"}],"claim_links":[{"claim":"pc11","relation":"supports","scope":"monotropic attention as patterned allocation with trade-offs rather than impairment","rationale":"Monotropism as a trade-off account.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{ rather than selection-only framing.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"flagged","annotation_note":"Unannotated, yet carries the statement that a four-dimensional evolutionary framework is required to account for neurodevelopmental diversity. Priority annotation: separate the four inheritance systems (genetic, epigenetic, behavioural, symbolic) from ESF's application; separate within-lifetime developmental effects from inter- and transgenerational transmission. Intellectual lineage, not proof of a neurodevelopmental inheritance mechanism (Constitution Article III). CARD PROMINENCE: central intellectual foundation (four inheritance systems; developmental production and transmission of variation) -- full annotation required; the 'background' relation on its links is an edge role, not a verdict on importance.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Lineage, not support. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c11"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c06"},{"review_status":"history (v1.0 support reading retired)","note":"Support interpretation retired: Niche construction is not this paper's subject. The topic assignment stays as history and navigation.","topic_relevance":"keep (historical navigation)","v1_topic":"c14"}],"claim_links":[{"claim":"pc09","relation":"background","scope":"central intellectual lineage: multiple interacting inheritance systems and developmental conditions contributing to transmitted variation","rationale":"Background is an edge role, not an importance ranking: the card must give this source prominent, complete treatment (Constitution Article III). Neither link tests ESF neurotypes.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"sp-cooperative-neurodiversity","relation":"background","scope":"central intellectual lineage for population-level reasoning about variation","rationale":"Lineage, scoped; not evidence for cooperative benefits.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"taylor-vestergaard-2022","layer":6,"annotated":false,"citation":"Taylor & Vestergaard (2022)","full":"Taylor, Helen, and Martin David Vestergaard. 2022. Developmental Dyslexia: Disorder or Specialization in Exploration? Frontiers in Psychology 13: 889245.","doi":"10.3389/fpsyg.2022.889245","tags":["EVO","ND"],"argues":"Dyslexia may reflect a cognitive specialization in exploratory, divergent processing rather than a reading disorder -- an evolutionary trade-off between efficiency and exploration.","esf":"Provides a concrete evolutionary reframing of a neurodiverse trait that ESF can extend to other neurotypes, including neuroperipheral profiles.","supports":["Neurodivergent cognitive styles may reflect adaptive specializations","Evolutionary framing opens space beyond deficit models"],"limits":"Specific to dyslexia; generalization requires careful analogical reasoning.","next":"Use as a model for ESF evolutionary reframing of neuroperipheral traits. Relevant to cooperative neurodiversity commentary.","aliases":[],"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Auto-check tripped on the '?' in the title; record matches.","annotation":"unannotated","annotation_note":"No annotation in v1.0.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reas . Ramstead, Samuel P. L. Veissière, John O. Campbell, and Karl J. Friston. 2018. A Variational Approach to Niche Construction. Journal of the Royal Society Interface 15(141): 20170685.","doi":"10.1098/rsif.2017.0685","tags":["EVO","PP","SOC","NET"],"argues":"Integrates niche construction with variational and predictive approaches, arguing that organisms actively shape the environments that make their regulation possible.","esf":"Very important for the broader ESF move beyond mismatch-only stories. Supports the claim that organisms and collectives do not merely adapt to environments but co-create regulatory niches.","supports":["Niche construction is part of regulation","Environment is not external background but part of the adaptive system","Diversity may matter because different organisms help construct different niches"],"limits":"Abstract and formal; benefits from translation into development, disability, and public-health language.","next":"Stronger ESF arguments about supportive environments and ecosystem health. Better theoretical grounding for cooperative neurodiversity.","aliases":[],"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"Title, year, volume and pages match the Crossref record.","annotation":"not yet checked","annotation_note":"Annotation text is the March 2026 original; content check against the paper's design and results not yet done.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c14"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c11"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c12"}],"claim_links":[{"claim":"pc12","relation ress.","doi":"10.1215/9780822380665","tags":["EVO","DEV","METH"],"argues":"Information is not pre-formed in genes but constructed through organism-environment interaction across development. Nature and nurture are co-constructing processes, not separable sources.","esf":"Foundational for ESF's rejection of nature/nurture framing. The organism-environment system is the unit of development; neurodevelopmental patterns emerge through interaction.","supports":["The organism-environment system is the unit of development","Neurodevelopmental patterns emerge through interaction, not pre-specification"],"limits":"Dense theoretical text; requires translation for clinical and advocacy audiences.","next":"Theoretical foundation for ESF's developmental systems position. Essential for Paper 1's conceptual scaffolding.","aliases":[],"related_versions":[],"evidence_type":"foundational theory","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"match","metadata_note":"2nd edition, Duke University Press 2000 (1st edn 1985, Cambridge UP). v1.0 citation stands.","annotation":"unannotated","annotation_note":"No annotation in v1.0.","links":"drafted (awaiting review)"},"legacy_links":[{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c14"},{"review_status":"history (reassessed as proposed claim links)","note":"covered by the draft claim_links on this source","v1_topic":"c06"}],"claim_links":[{"claim":"pc09","relation":"refines","scope":"architecture is itself developmentally constructed; calibration acts on an organisation that development helped produce","rationale":"Refines the boundary in Public Claim 9 and Constitution P5; labelled interpretation where it reaches ESF's terms.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc12","relation":"supports","scope":"organism-environment system as the unit of development","rationale":"Supports environment as constitutive.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"},{"claim":"pc07","relation":"refines","scope":"developmental-systems reasoning cautions against treating regulatory organisation as a preformed genetic blueprint","rationale":"An ontological boundary on how 'architecture' may be read (not development-free, not purely genetic); not an empirical architectural/parametric discrimination. The application to bio-neurotypes is ESF interpretation.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval"}],"modules":[]},{"id":"hogenkamp-2026-rb","layer":1,"annotated":true,"citation":"Hogenkamp (2026a) -- Regulatory Bandwidth","full":"Hogenkamp, Lori. 2026. Regulatory Bandwidth: A Theoretical Integration of Present Multisystem Stress-Regulatory Capacity. Psychoneuroendocrinology 192: 107955.","doi":"10.1016/j.psyneuen.2026.107955","tags":["REG","STR","EN","CLIN"],"argues":"Defines Regulatory Bandwidth as the organism's present coordinated regulatory capacity across interacting stress-responsive systems: the flexible range over which autonomic, neuroendocrine, inflammatory, and metabolic processes can adjust to environmental demand without functional destabilization. Integrates allostasis, interoception, and bioenergetics into one construct that is present-tense, coordinated, and multisystem.","esf":"The canon anchor for the framework's central construct. Everything the map says about capacity, narrowing, and recovery routes through this definition. It fixes the boundary the rest of the framework relies on: bandwidth is a range the coupled system can cover, not a stored amount, a budget, or a level in a tank, and it is distinct from Regulatory Margin (where current demand stands relative to reserve).","supports":["Regulation is coordinated across systems and assessed in the present, not inferred from a trait score","Stress physiology, interoception, and energetics belong in one regulatory account","Burnout can be read as sustained narrowing of bandwidth under prolonged demand-resource mismatch"],"limits":"A theoretical integration with a published anchor, not a validated measure; evidence status is ESF synthesis. The paper uses 'capacity' -- the boundary is 'not a stored resource', not 'not capacity'. Scalar summaries of bandwidth are conditional (see Not a Scalar).","next":"First-use definitional line for every teaching module. Pair with Not a Scalar before any attempt to operationalize. Source for the RB vs Margin distinction in the glossary and the Terminology and Boundary Map.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc13","relation":"develops","scope":"the Regulatory Bandwidth construct named in Public Claim 13 (construct paper, distinct from the formal measurement argument)","rationale":"Defines RB as present coordinated regulatory capacity across interacting stress-responsive systems and positions it against load and calibration -- the construct Public Claim 13 names; the non-scalar measurement boundary comes from the Frontiers paper, not this one.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Section 1 definition; load / calibration / RB positioning triad"},{"claim":"pc01","relation":"develops","scope":"stress as adaptive regulation","rationale":"Treats stress mediators as the machinery of coordinated adaptation whose prolonged engagement narrows the range -- both halves of Public Claim 1.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Introduction and construct sections"},{"claim":"pc05","relation":"develops","scope":"multisystem regulation","rationale":"Integrates autonomic, neuroendocrine, inflammatory and metabolic processes into one capacity construct.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Definition and multisystem integration sections"},{"claim":"pc04","relation":"develops","scope":"recovery and sustainability in the evaluation of health","rationale":"Frames capacity as a present range whose narrowing and recovery are the quantities to evaluate, consistent with evaluating health through consequences over time.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Discussion of narrowing and recovery"}],"modules":[],"card_status":"esf-publication"},{"id":"hogenkamp-2026-not-a-scalar","layer":4,"annotated":true,"citation":"Hogenkamp (2026b) -- Not a Scalar","full":"Hogenkamp, Lori. 2026. Regulatory Capacity Is Not a Scalar: Metrics, Perturbations, and Viability in Network Physiology. Frontiers in Network Physiology 6: 1961712.","doi":"10.3389/fnetp.2026.1961712","tags":["NET","METH","REG","CLIN"],"argues":"Shows that standardization, weighting, thresholds, and cost-functional choices in stress physiology are constitutive assumptions rather than neutral preprocessing. Develops Regulatory Bandwidth as a set- and profile-valued relation among the represented system, the perturbation, the metric or burden criterion, the viability endpoint, and the time horizon. Demonstrates that two regulatory architectures with identical spectra can reverse rank when the metric or perturbation changes.","esf":"The methodological spine of the framework's measurement claims. It licenses the map's insistence that any single capacity score is conditional on declared measurement conditions, and it separates two evidentiary objects: the mathematical demonstration (established within its assumptions) and the empirical hypothesis about biological architecture (not established by it).","supports":["Any scalar summary of regulatory capacity is conditional on system, perturbation, criterion, viability endpoint, and horizon","Rank order between systems is not invariant to the metric -- a profile must be retained before scalarization","Rejecting a one-scalar rescaling rejects a one-parameter model without establishing a different architecture"],"limits":"Hypothesis and Theory article; the demonstration is formal, not an empirical result about autism. It does not by itself establish manifold connectedness or architectural heterogeneity. Evidence status: methodological implication with a published anchor.","next":"Teaching module on 'capacity is not a single number' (public explainer, professional piece, research roadmap). Design template for the registered-report test of RB's predictive validity. Required companion to any biomarker or biotyping source in Layer 2.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"methodological critique","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc13","relation":"develops","scope":"the formal measurement argument named in Public Claim 13 (rank reversal under changed metric/perturbation); a mathematical result under assumptions, not evidence discriminating biological architectures","rationale":"Shows rank reversal between two architectures with identical spectra under a change of metric or perturbation (Figure 1; W = diag(1,8,1) vs diag(1,1,8)) and develops RB as a set- and profile-valued relation -- the formal measurement argument Public Claim 13 cites.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Section 3; Figure 1; Tables 1-4"},{"claim":"pc08","relation":"develops","scope":"profiles do not identify architecture","rationale":"Argues that an observed response profile does not identify the generating architecture; the architectural null (section 7/8.1) states that failure of a one-scalar rescaling rejects a one-parameter model without establishing a different architecture.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Sections 7 and 8.1"},{"claim":"pc14","relation":"develops","scope":"architecture-aware measurement infrastructure","rationale":"Prescribes declaring system, perturbation, criterion, viability endpoint and horizon before any scalar summary -- a methodological requirement for architecture-aware measurement.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Section 8 predictions and null models"}],"modules":[],"card_status":"esf-publication"},{"id":"hogenkamp-sanghavi-natri-2026","layer":5,"annotated":true,"citation":"Hogenkamp, Sanghavi & Natri (2026)","full":"Hogenkamp, Lori, Dhwani Sanghavi, and Heini Natri. 2026. Toward an Emergent Paradigm for Neurodiversity and Health. Autism in Adulthood.","doi":"10.1177/25739581261433443","tags":["ND","REG","NET","METH"],"argues":"Proposes an emergent paradigm in which neurodiversity and health are not separate questions: traits, support needs, and co-occurring conditions arise together from brain-body-environment regulation across development. Introduces the bio-neurotype as the biological dimensions of an emergent neurotype, potentially measurable through indicators such as mitochondrial function, autonomic flexibility, and interoceptive processing.","esf":"The first paper of the core arc. It introduces bio-neurotype and emergent neurotype; the three-layer scheme with calibration as a named middle layer was formalised later in the Terminology and Boundary Map and should not be read back into this paper. It is the bridge between neurodiversity scholarship in this domain and the physiology in E1 and E2, and the reason the map refuses to split identity from embodiment.","supports":["Neurodiversity and health belong in one emergent account rather than separate silos","A neurotype can be described at the level of regulatory organization, not only behavior or diagnosis","Context and relationship are part of how a profile is expressed"],"limits":"A paradigm paper: it frames and names, it does not test. The bio-neurotype indicators are candidates, not validated markers. Later papers refine its bandwidth wording -- the published Psychoneuroendocrinology definition supersedes the gloss used here.","next":"Entry point for advocate-facing modules. Source for the first-use lines on bio-neurotype and emergent neurotype. Pair with Chapman (2021) and Milton (2012) to show where the framework extends relational accounts into embodied ecology.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc09","relation":"develops","scope":"bio-neurotype and emergent neurotype as terms; not the full three-layer scheme","rationale":"Introduces bio-neurotype (Table 1: biological dimensions of an emergent neurotype, with candidate indicators) and emergent neurotype; the later three-layer scheme is not attributed to this paper.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Table 1 and definitions"},{"claim":"pc08","relation":"develops","scope":"diagnosis as expressed profile","rationale":"Separates the observable neurotype from its biological dimensions, implying a diagnosis reads the expressed profile.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Framework section"},{"claim":"pc12","relation":"develops","scope":"context as part of how a profile is expressed","rationale":"Places context and relationship among the conditions under which a profile is expressed.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Emergent paradigm section"}],"modules":[],"card_status":"esf-publication"},{"id":"hogenkamp-2026-beyond-parametric","layer":6,"annotated":true,"citation":"Hogenkamp (in press) -- Beyond Parametric Variation","full":"Hogenkamp, Lori. In press. Beyond Parametric Variation: Neurodevelopmental Diversity as Architectural Heterogeneity in Biological Control Systems. Biological Theory.","doi":null,"tags":["EVO","NET","DEV","ND","METH"],"argues":"Proposes (active empirical hypothesis; in press at Biological Theory, accepted October 2026) that neurodevelopmental variation may include architectural heterogeneity -- differences in the structure, coupling, functional form, dimensionality, or timescale organization of the regulatory control system -- and is not exhausted by parametric heterogeneity, differences in the settings of a shared design. Identifies the conserved-architecture assumption in adaptive-calibration and robustness models, reads stress incoherence as architectural mismatch, and sets out empirical signatures that would discriminate the two kinds of variation.","esf":"The load-bearing claim of the framework, stated as a testable hypothesis. It is why the map treats heterogeneity as meaningful rather than noise, and why calibration (Layer 3) is never allowed to stand in for architecture. It also carries the cooperative-neurodiversity hypothesis into population-level reasoning in this layer.","supports":["Some variation is in system organization, not only in parameter settings on a shared model","The architecture-calibration assignment is model-relative and requires a declared model class","Different architectures yield different robustness-fragility profiles rather than positions on one scale"],"limits":"Active empirical hypothesis: existing evidence motivates the distinction but does not yet discriminate architecture from flexible parametric variation. Not categorical subtyping, not a severity ladder, not inferable from diagnosis alone. Cooperative neurodiversity here must be read with the canon's coupling boundary, not as a portfolio account.","next":"Anchors the architectural claim once the DOI is live (status label flips, wording unchanged). Teaching module on architecture vs parameters. Model-comparison and registered-report designs in the 2027 testing phase.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"pending (in press)","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc07","relation":"develops","scope":"the architectural-heterogeneity hypothesis as stated in Public Claim 7","rationale":"States the architectural-heterogeneity hypothesis, names the conserved-architecture assumption in Del Giudice and Kitano, and lists empirical signatures intended to discriminate it from flexible parametric variation; evidence boundary stated by the paper itself.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Sections on the conserved-architecture assumption, parametric vs architectural, and implications/five signatures"},{"claim":"pc11","relation":"develops","scope":"robustness-fragility trade-offs across architectures","rationale":"Derives different robustness-fragility profiles from different architectures (Kitano-style trade-offs).","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Robustness/trade-off discussion"},{"claim":"pc09","relation":"develops","scope":"architecture as prior to calibration","rationale":"Argues that calibration presupposes an organisation being calibrated (architecture analytically prior), while allowing developmental reorganisation as a distinct process.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Parametric vs architectural section"}],"modules":[],"card_status":"esf-publication"},{"id":"hogenkamp-2026-evidence-ecologies","layer":4,"annotated":true,"citation":"Hogenkamp (2026) -- Evidence Ecologies","full":"Hogenkamp, Lori. 2026. From Evidence Hierarchies to Evidence Ecologies: Reframing Evidence-Based Medicine for Complexity, Multimorbidity, Neurodivergence, and Allostasis. Center for Adaptive Stress white paper, version 1.0. Zenodo.","doi":"10.5281/zenodo.21907022","tags":["METH","NET","CLIN"],"argues":"Argues that evidence-based medicine should be extended rather than rejected: hierarchy-heavy evidence fits bounded questions, while complex adaptive health problems need rigor matched to the question. Proposes an evidence-ecology matrix mapping evidence forms to the questions they can answer, and states testable hypotheses.","esf":"The epistemic companion to the map itself. It explains why a source's evidence type is recorded next to its claim, why lived experience counts as pattern evidence, and why a biomarker study and a conceptual model do different jobs in the same layer.","supports":["Evidence forms must be matched to the kind of question being asked","Multimorbidity and heterogeneity are poorly served by single-cause evidence designs","Methodological choices are part of the finding, not prior to it"],"limits":"A white paper, not peer reviewed; evidence status is methodological implication. Introduces 'allostatic interoceptive predictability', which is a working term outside the canonical construct list.","next":"Teaching module on reading evidence for complex systems, including the exercise of annotating an unannotated map source. Basis for the evidence-type field added to every source card in v2.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"methodological critique","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc14","relation":"develops","scope":"evidence forms matched to questions; cross-system infrastructure","rationale":"Proposes the evidence-ecology matrix mapping evidence forms to the questions they answer and argues for better-matched rigor across systems and timescales.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Section 7 matrix; section 8 ESF worked example"},{"claim":"pc13","relation":"develops","scope":"methodological choices as part of the finding","rationale":"Treats methodological choices (what is measured, how aggregated) as part of the finding -- the premise of conditional measurement.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Sections 7 and 11"}],"modules":[],"card_status":"esf-publication"},{"id":"hogenkamp-2026-dementia","layer":4,"annotated":true,"citation":"Hogenkamp (2026) -- Risk to Regulatory Architecture","full":"Hogenkamp, Lori. 2026. From Risk Architecture to Regulatory Architecture in Dementia Prevention. Center for Adaptive Stress working paper, version 1.0. Zenodo.","doi":"10.5281/zenodo.22755346","tags":["NET","REG","CLIN"],"argues":"Responds to interacting-exposure models of dementia risk by asking what the systems that absorb those exposures are doing: risk architecture maps configurations of exposure, regulatory architecture asks how a living system absorbs and recovers from them. Proposes this as the missing middle between population risk configuration and individual trajectory.","esf":"Shows the framework working outside autism, in the aging lane, with the same regulatory vocabulary. It links the map's network-medicine layer to recovery dynamics and recovery burden over the life course.","supports":["Conditions emerge from how regulatory systems absorb interacting exposures, not from exposures alone","Recovery and its cost belong in prevention models","The same regulatory account applies across developmental and aging conditions"],"limits":"Working paper, not peer reviewed. 'Regulatory architecture' is a canonical Layer-1 term in the Terminology and Boundary Map; what is provisional here is its application to dementia prevention, which the paper itself marks as a proposal.","next":"Teaching module applying the framework to aging; cross-link to the sundowning series. Candidate for the commentary and companion pieces in progress.","aliases":[],"draft":true,"related_versions":[],"evidence_type":"conceptual model","evidence_type_status":"draft","audit":{"doi_identity":"confirmed","metadata":"author-supplied","metadata_note":"Own publication; checked against the publisher record where a DOI exists.","annotation":"draft","annotation_note":"First-pass annotation (17 Oct 2026) written from the published text; carries a 'develops' relation only, which is displayed and never counted as support.","links":"draft"},"legacy_links":[],"claim_links":[{"claim":"pc02","relation":"develops","scope":"regulation under constraint applied to dementia risk","rationale":"Reads dementia risk as regulation under interacting constraints: risk architecture (exposures) vs regulatory architecture (how the system absorbs them).","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Core distinction section"},{"claim":"pc14","relation":"develops","scope":"the missing middle between population risk configuration and individual trajectory","rationale":"Proposes the regulatory layer as the missing middle between population risk configuration and individual trajectory.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Missing-middle argument"},{"claim":"pc04","relation":"develops","scope":"recovery and burden in the evaluation of health","rationale":"Puts recovery and recovery burden into the evaluation of prevention outcomes.","review_status":"proposed","author":"proposed in the v2.0 rebuild (Oct 2026); awaiting the author's approval","source_location":"Recovery discussion"}],"modules":[],"card_status":"esf-publication"},{"id":"schworer-2022","layer":2,"annotated":true,"citation":"Schworer et al. (2022)","full":"Schworer, Emily K., Ameena Ahmed, chiatry 13: 985713.","doi":"10.3389/fpsyt.2022.985713","note":"Article number corrected: v1.0 gave 752210; the DOI and publisher record are 985713 (Frontiers records carry an article number, not a page field). Author names re-checked against Crossref on 26 Oct 2026: Caitlyn Mahony, as in v1.0 (an interim draft had this wrong)."},{"kind":"citation","source":"ward-2023","citation":"Ward et al. (2023)","v1":"Ward, John H., Elizabeth Weir, Carrie Allison, and Simon Baron-Cohen. 2023. Increased Rates of Chronic Physical Health Conditions across All Organ Systems in Autistic Adolescents and Adults. Molecular Autism 14: 4.","v2":"Ward, John H., Elizabeth Weir, Carrie Allison, and Simon Baron-Cohen. 2023. Increased Rates of Chronic Physical Health Conditions across All Organ Systems in Autistic Adolescents and Adults. Molecular Autism 14: 35.","doi":"10.1186/s13229-023-00565-2","note":"Article number corrected: v1.0 gave 14:4; the publisher record is Molecular Autism 14, article 35. Author list re-checked against Crossref on 26 Oct 2026: John H. Ward, Elizabeth Weir, Carrie Allison, Simon Baron-Cohen, as in v1.0."},{"kind":"citation","source":"onions-2024","citation":"O'Nions et al. (2024)","v1":"O'Nions, Elizabeth, et al. 2024. Estimating Life Expectancy and Years of Life Lost for Autistic People in the UK: A Matched Cohort Study. The Lancet Regional Health -- Europe 31: 100674.","v2":"O'Nions, Elizabeth, et al. 2024. Estimating Life Expectancy and Years of Life Lost for Autistic People in the UK: A Matched Cohort Study. The Lancet Regional Health -- Europe 36: 100776.","doi":"10.1016/j.lanepe.2023.100776","note":"v1.0 gave volume 31, article 100674; record is volume 36, article 100776."},{"kind":"citation","source":"nijhof-2025","citation":"Nijhof et al. (2025)","v1":"Sosenko, Filip, et al. 2024. Making a Case for an Autism-Specific Multimorbidity Index: A Comparative Cohort Study. EClinicalMedicine 71: 102589.","v2":"Nijhof, Dewy, Filip Sosenko, Laura McKernan Ward, Debo 22. The Evolution of Complementary Cognition: Humans Cooperatively Adapt and Evolve through a System of Collective Cognitive Search. Cambridge Archaeological Journal 32(1): 61-77.","doi":"10.1017/S0959774321000329","note":"Subtitle missing in v1.0. Crossref 'issued' year is 2021 (online-first); the map cites the issue year, which is correct."},{"kind":"annotation","source":"bobba-alves-2022","citation":"Bobba-Alves et al. (2022)","retired":"'Regulatory bandwidth is measurable and finite' (supports line) and 'Use as empirical anchor for ESF Paper 3's Regulatory Bandwidth construct' (next line)","replacement":"The paper is a narrative review developing an energetic model of allostatic load. It supports the cost side of regulation and does not measure or validate Regulatory Bandwidth. Evidence type corrected from empirical study to review."},{"kind":"annotation","source":"nijhof-2025","citation":"Nijhof et al. (2025)","retired":"The v1.0 card (under Sosenko et al. 2024) described a general argument for an autism-specific multimorbidity index","replacement":"The published study compares multimorbidity indices for predicting COVID-19 mortality among 1,027 hospitalised autistic adults and proposes a three-predictor index that outperformed the Quan index (AUC 0.872 vs 0.828). Read as an example of scoped, outcome-specific measurement, not as validation of regulatory coupling."},{"kind":"annotation","source":"miot-2023","citation":"Miot et al. (2023)","retired":"'Supports one of the framework's strongest claims: chronic conditions often cluster ... because they are expressions of interacting system states'","replacement":"The study reports clustering and subgroups in a cohort of 63 autistic adults with intellectual disability at one time point. Association and clustering are kept distinct from an ESF mechanism of within-person coupling."},{"kind":"annotation","source":"mahony-2022","citation":"Mahony & O'Ryan (2022)","retired":"Evidence type empirical study (v1.0 implicit)","replacement":"Conceptual framework: mitochondrial allostatic load as a proposed, untested mediator. Supports lines kept in their hedged form."},{"kind":"structure","change":"The 14 map claims of March 2026 (c01-c14) are no longer a claim set. They are kept as navigation topics with their history; the Field Guide's 14 Public Claims (v1.0, 17 Oct 2026) are the only numbered claims."},{"kind":"structure","change":"Two March 2026 claims are retired as wording: c02 (superseded by Public Claim 4, which no longer equates emergent allostasis with health) and c11 (cooperative neurodiversity, now a supplementary proposition from the Terminology and Boundary Map, not a child of Public Claim 7)."},{"kind":"structure","change":"Source-to-claim connections are no longer undifferentiated 'supports' lists. Each is typed (supports / constrains / refines / challenges / background / develops), scoped, and carries a review status. In v2.0.0 all 175 typed links are PROPOSED and none is counted. The 128 v1.0 topic links are kept as history; 19 of them are marked as retired support readings."},{"kind":"structure","change":"'Evidence Layers 1-6' are now 'Evidence Domains E1-E6' (ESF Constitution, Article III), so that 'Layer 1/2/3' is free for its canonical meaning (architecture / calibration / expressed profile)."},{"kind":"structure","change":"Seven ESF publications (Papers 1, 2A, 3, 5; Evidence Ecologies; the dementia working paper; and Schworer et al. 2022 as a scoped external card) are added. The ESF papers carry a 'develops' relation only: developed-in is not supported-by."}]}}</script>
