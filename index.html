        e('div',{style:{width:36,height:36,borderRadius:'50%',background:'#0d1117',border:'1.5px solid #4FC3F7',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          e('div',{className:'dot-pulse',style:{background:'#4FC3F7',width:7,height:7}})
        ),
        e('div',null,
          e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.12em',color:'#6e7681',textTransform:'uppercase',marginBottom:2}},'Center for Adaptive Stress'),
          e('div',{style:{fontSize:17,fontWeight:600,color:'#e6edf3'}},'ESF Rosetta Stone Map')
        )
      ),
      e('p',{style:{fontSize:15,lineHeight:1.7,color:'#c9d1d9',marginBottom:16}},'This map translates the Evolutionary Stress Framework (ESF) evidence library into a navigable knowledge architecture. Sources are annotated for what they argue, why they matter for ESF, what claims they support, their limits, and what they make possible next.'),
      e('p',{style:{fontSize:15,lineHeight:1.7,color:'#c9d1d9',marginBottom:16}},'The ESF is a meta-framework applying complexity science to stress physiology, neurodiversity, and health, developed by the Center for Adaptive Stress -- a nonprofit conceptual systems research organization in Cincinnati, Ohio.'),
      e('div',{style:{background:'#0d1117',borderRadius:8,padding:'14px 16px',marginBottom:16,border:'1px solid #21262d'}},
        e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}},'Two views'),
        e('div',{style:{fontSize:13,lineHeight:1.8,color:'#8b949e'}},
          e('div',null,'Sources -- browse 50 sources across 6 evidence layers, filter by tag'),
          e('div',null,'Claims -- explore 14 major ESF claims and the sources that support each one')
        )
      ),
      e('div',{style:{background:'#0d1117',borderRadius:8,padding:'14px 16px',marginBottom:20,border:'1px solid #21262d'}},
        e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}},'How to navigate'),
        e('div',{style:{fontSize:13,lineHeight:1.8,color:'#8b949e'}},
          e('div',null,'-- Select a layer or claim in the left panel'),
          e('div',null,'-- Click any card to open its full annotation'),
          e('div',null,'-- Filter by tag to cross-cut the layers'),
          e('div',null,'-- Colored dots in the header are layer quick-switches')
        )
      ),
      e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#6e7681',marginBottom:14}},
        SOURCES.length+' sources total -- '+annotated+' fully annotated -- Phase 1 + 2 build'
      ),
      e('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
        e('a',{href:'https://ndstress.org',target:'_blank',rel:'noopener',style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'#4FC3F7',padding:'6px 14px',border:'1px solid rgba(79,195,247,.3)',borderRadius:5,background:'rgba(79,195,247,.06)'}},'ndstress.org'),
        e('a',{href:'https://evostress.blog',target:'_blank',rel:'noopener',style:{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'#A5D6A7',padding:'6px 14px',border:'1px solid rgba(165,214,167,.3)',borderRadius:5,background:'rgba(165,214,167,.06)'}},'evostress.blog')
      )
    )
  );
}

function App(){
  var _s1=useState('sources'), mode=_s1[0], setMode=_s1[1];
  var _s2=useState(1),         selLayer=_s2[0], setSelLayer=_s2[1];
  var _s3=useState(null),      selClaim=_s3[0], setSelClaim=_s3[1];
  var _s4=useState(null),      selSrc=_s4[0],   setSelSrc=_s4[1];
  var _s5=useState(null),      filterTag=_s5[0],setFilterTag=_s5[1];
  var _s6=useState(''),        query=_s6[0],    setQuery=_s6[1];
  var _s7=useState(false),     annOnly=_s7[0],  setAnnOnly=_s7[1];
  var _s8=useState(false),     showAbout=_s8[0],setShowAbout=_s8[1];

  var curLayer=LAYER_MAP[selLayer];

  var filteredSources=useMemo(function(){
    return SOURCES.filter(function(s){
      if(s.layer!==selLayer) return false;
      if(filterTag&&s.tags.indexOf(filterTag)<0) return false;
      if(annOnly&&!s.annotated) return false;
      if(query){var q=query.toLowerCase();return s.citation.toLowerCase().indexOf(q)>=0||(s.argues&&s.argues.toLowerCase().indexOf(q)>=0)||(s.esf&&s.esf.toLowerCase().indexOf(q)>=0);}
      return true;
    });
  },[selLayer,filterTag,query,annOnly]);

  var claimSources=useMemo(function(){
    if(!selClaim) return [];
    return SOURCES.filter(function(s){return s.claims&&s.claims.indexOf(selClaim.id)>=0;});
  },[selClaim]);

  var counts=useMemo(function(){
    var c={};LAYERS.forEach(function(l){c[l.id]=SOURCES.filter(function(s){return s.layer===l.id;}).length;});return c;
  },[]);

  function switchMode(m){setMode(m);setSelSrc(null);}
  function selectLayer(id){setSelLayer(id);setSelSrc(null);}
  function toggleTag(t){setFilterTag(filterTag===t?null:t);}

  // SIDEBAR - SOURCES MODE
  var sidebarSources=e('div',{style:{flex:1,overflowY:'auto'}},
    e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',color:'#6e7681',textTransform:'uppercase',padding:'0 4px',marginBottom:9}},'Evidence Layers'),
    LAYERS.map(function(layer){
      var active=selLayer===layer.id;
      return e('button',{key:layer.id,className:'lbtn',onClick:function(){selectLayer(layer.id);},style:{color:active?layer.color:'#8b949e',background:active?layer.glow:'transparent',borderLeft:active?'3px solid '+layer.color:'3px solid transparent'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
          e('div',null,
            e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.08em',color:active?layer.color:'#6e7681',marginBottom:2}},'LAYER '+layer.id),
            e('div',{style:{fontSize:13,lineHeight:1.3}},layer.shortName)
          ),
          e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:active?layer.color:'#6e7681',marginTop:2}},counts[layer.id])
        )
      );
    }),
    e('div',{style:{borderTop:'1px solid #21262d',marginTop:14,paddingTop:12}},
      e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',color:'#6e7681',textTransform:'uppercase',marginBottom:9,paddingLeft:4}},'Filter by Tag'),
      e('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
        TAG_KEYS.map(function(tag){
          var t=TAGS[tag];var active=filterTag===tag;
          return e('button',{key:tag,className:'ftag',title:t.title,onClick:function(){toggleTag(tag);},style:{color:active?t.color:'#6e7681',borderColor:active?t.color:'#30363d',background:active?'rgba('+rgb(t.color)+',.1)':'transparent'}},tag);
        })
      )
    ),
    e('div',{style:{marginTop:12,paddingLeft:4}},
      e('label',{style:{display:'flex',alignItems:'center',gap:7,cursor:'pointer'}},
        e('input',{type:'checkbox',checked:annOnly,onChange:function(ev){setAnnOnly(ev.target.checked);}}),
        e('span',{style:{fontSize:12,color:'#8b949e'}},'Annotated only')
      )
    )
  );

  // SIDEBAR - CLAIMS MODE
  var sidebarClaims=e('div',{style:{flex:1,overflowY:'auto'}},
    e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',color:'#6e7681',textTransform:'uppercase',padding:'0 4px',marginBottom:9}},'ESF Claims'),
    CLAIMS.map(function(claim){
      var active=selClaim&&selClaim.id===claim.id;
      var layer=LAYER_MAP[claim.layer_home];
      var srcCount=SOURCES.filter(function(s){return s.claims&&s.claims.indexOf(claim.id)>=0;}).length;
      return e('button',{key:claim.id,className:'lbtn',onClick:function(){setSelClaim(active?null:claim);setSelSrc(null);},style:{color:active?layer.color:'#8b949e',background:active?layer.glow:'transparent',borderLeft:active?'3px solid '+layer.color:'3px solid transparent'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:4}},
          e('div',{style:{flex:1}},
            e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.06em',color:active?layer.color:'#6e7681',marginBottom:2}},claim.id.toUpperCase()),
            e('div',{style:{fontSize:12,lineHeight:1.4}},claim.label)
          ),
          e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:active?layer.color:'#6e7681',marginTop:2,flexShrink:0}},srcCount)
        )
      );
    })
  );

  // SIDEBAR SHARED BOTTOM
  var sidebarBottom=e('div',{style:{marginTop:'auto',paddingTop:14,borderTop:'1px solid #21262d',padding:'14px 4px 0'}},
    e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.06em',color:'#6e7681',marginBottom:8}},
      SOURCES.length+' sources -- '+CLAIMS.length+' claims'
    ),
    e('button',{onClick:function(){setShowAbout(true);},style:{width:'100%',padding:'7px 0',background:'rgba(79,195,247,.06)',border:'1px solid rgba(79,195,247,.2)',borderRadius:5,color:'#4FC3F7',fontFamily:"'JetBrains Mono',monospace",fontSize:10,cursor:'pointer',letterSpacing:'0.06em',transition:'all .15s'}},'About this map'),
    e('div',{style:{marginTop:8,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681',lineHeight:1.8}},
      e('a',{href:'https://ndstress.org',target:'_blank',rel:'noopener',style:{color:'#4FC3F7',display:'block'}},'ndstress.org'),
      e('a',{href:'https://evostress.blog',target:'_blank',rel:'noopener',style:{color:'#A5D6A7',display:'block'}},'evostress.blog')
    )
  );

  var sidebar=e('div',{style:{width:215,minWidth:215,background:'#161b22',borderRight:'1px solid #21262d',padding:'12px 9px',overflowY:'auto',flexShrink:0,display:'flex',flexDirection:'column'}},
    mode==='sources'?sidebarSources:sidebarClaims,
    sidebarBottom
  );

  // LAYER HEADER (sources mode)
  var layerHeader=e('div',{style:{padding:'13px 18px 11px',borderBottom:'1px solid #21262d',background:'#0d1117',flexShrink:0}},
    e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
      e('div',{style:{width:7,height:7,borderRadius:'50%',background:curLayer.color,boxShadow:'0 0 8px '+curLayer.color,flexShrink:0}}),
      e('span',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',color:curLayer.color,textTransform:'uppercase'}},'Layer '+curLayer.id)
    ),
    e('h2',{style:{margin:'0 0 4px',fontSize:16,fontWeight:600,color:'#e6edf3',letterSpacing:'-0.01em'}},curLayer.name),
    e('p',{style:{margin:'0 0 9px',fontSize:13,color:'#8b949e',fontStyle:'italic'}},curLayer.question),
    e('div',{style:{display:'flex',flexWrap:'wrap',gap:4,marginBottom:9}},
      curLayer.domains.map(function(d){return e('span',{key:d,style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,padding:'2px 7px',background:'rgba('+rgb(curLayer.color)+',.08)',color:curLayer.color,borderRadius:3,border:'1px solid rgba('+rgb(curLayer.color)+',.2)'}},d);})
    ),
    e('input',{type:'text',placeholder:'Search sources in this layer...',value:query,onChange:function(ev){setQuery(ev.target.value);},style:{background:'#161b22',border:'1px solid #30363d',borderRadius:5,padding:'6px 11px',color:'#c9d1d9',fontSize:13,fontFamily:"'Crimson Text',serif",width:320}})
  );

  // SOURCE CARD renderer
  function SourceCard(src, activeId, onSelect, accentColor){
    var active=activeId&&activeId===src.id;
    return e('div',{key:src.id,className:'scard',onClick:function(){onSelect(src);},style:{borderColor:active?accentColor:'#21262d',background:active?'rgba('+rgb(accentColor)+',.06)':'#161b22'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}},
        e('div',{style:{fontSize:14,fontWeight:600,color:'#e6edf3',lineHeight:1.3}},src.citation),
        e('div',{style:{display:'flex',gap:5,alignItems:'center',flexShrink:0}},
          e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:8,padding:'1px 5px',borderRadius:2,color:LAYER_MAP[src.layer].color,border:'1px solid rgba('+rgb(LAYER_MAP[src.layer].color)+',.3)'}},
            'L'+src.layer
          ),
          e('span',{className:'badge',style:{color:src.annotated?accentColor:'#6e7681',border:'1px '+(src.annotated?'solid':'dashed')+' '+(src.annotated?accentColor:'#30363d')}},src.annotated?'full':'stub')
        )
      ),
      e('div',{style:{marginTop:5,display:'flex',flexWrap:'wrap'}},
        src.tags.map(function(tag){var t=TAGS[tag];return e('span',{key:tag,className:'chip',onClick:function(ev){ev.stopPropagation();toggleTag(tag);},style:{background:'rgba('+rgb(t.color)+',.12)',color:t.color,border:'1px solid rgba('+rgb(t.color)+',.25)'}},tag);})
      ),
      !active&&src.esf&&e('div',{style:{marginTop:6,fontSize:12,color:'#8b949e',lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}},src.esf)
    );
  }

  // DETAIL PANEL renderer
  function DetailPanel(src, accentColor, onClose){
    return e('div',{style:{width:'58%',borderLeft:'1px solid #21262d',overflowY:'auto',padding:'18px 20px',background:'#0d1117'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:13}},
        e('div',{style:{flex:1,paddingRight:10}},
          e('h3',{style:{margin:0,fontSize:16,fontWeight:600,color:'#e6edf3',lineHeight:1.3}},src.citation),
          e('p',{style:{margin:'4px 0 0',fontSize:12,color:'#8b949e',fontStyle:'italic',lineHeight:1.4}},src.full)
        ),
        e('button',{className:'cbtn',onClick:onClose},'x')
      ),
      e('div',{style:{display:'flex',flexWrap:'wrap',marginBottom:8}},
        src.tags.map(function(tag){var t=TAGS[tag];return e('span',{key:tag,className:'chip',style:{background:'rgba('+rgb(t.color)+',.12)',color:t.color,border:'1px solid rgba('+rgb(t.color)+',.25)',fontSize:11}},tag+' -- '+t.title);})
      ),
      src.claims&&src.claims.length>0&&e('div',{style:{marginBottom:13}},
        e(Label,{text:'ESF Claims supported',color:'#d2a679'}),
        e('div',{style:{display:'flex',flexWrap:'wrap',gap:5}},
          src.claims.map(function(cid){
            var claim=CLAIMS.find(function(c){return c.id===cid;});
            if(!claim) return null;
            var cl=LAYER_MAP[claim.layer_home];
            return e('div',{key:cid,style:{padding:'3px 9px',borderRadius:4,background:'rgba('+rgb(cl.color)+',.1)',border:'1px solid rgba('+rgb(cl.color)+',.25)',fontSize:12,color:cl.color,cursor:'pointer'},onClick:function(){switchMode('claims');setSelClaim(claim);setSelSrc(null);}},claim.label);
          })
        )
      ),
      src.argues&&e('div',{className:'dsec'},e(Label,{text:'What it argues',color:accentColor}),e('p',{style:{margin:0,fontSize:14,lineHeight:1.65,color:'#c9d1d9'}},src.argues)),
      src.esf&&e('div',{className:'dsec'},e(Label,{text:'Why it matters for ESF',color:accentColor}),e('p',{style:{margin:0,fontSize:14,lineHeight:1.65,color:'#c9d1d9'}},src.esf)),
      src.supports&&e('div',{className:'dsec'},e(Label,{text:'Claims it supports',color:accentColor}),e('ul',{style:{margin:0,paddingLeft:18}},src.supports.map(function(s,i){return e('li',{key:i,style:{fontSize:13,lineHeight:1.6,color:'#c9d1d9',marginBottom:3}},s);}))),
      src.limits&&e('div',{className:'dsec'},e(Label,{text:'Limits / cautions',color:'#f0883e'}),e('p',{style:{margin:0,fontSize:13,lineHeight:1.6,color:'#8b949e'}},src.limits)),
      src.next&&e('div',{className:'dsec'},e(Label,{text:'What this makes possible',color:'#3fb950'}),e('p',{style:{margin:0,fontSize:13,lineHeight:1.6,color:'#c9d1d9'}},src.next)),
      !src.annotated&&e('div',{style:{padding:'10px 13px',background:'#161b22',borderRadius:6,border:'1px dashed #30363d',marginTop:6}},e('p',{style:{margin:0,fontSize:12,color:'#6e7681',fontStyle:'italic'}},'Queued for full annotation in a subsequent build phase.'))
    );
  }

  // SOURCES VIEW
  var sourcesView=e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
    layerHeader,
    e('div',{style:{display:'flex',flex:1,overflow:'hidden'}},
      e('div',{style:{width:selSrc?'42%':'100%',overflowY:'auto',padding:'11px 14px',transition:'width .25s'}},
        e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#6e7681',marginBottom:9,letterSpacing:'0.06em'}},
          filteredSources.length+' source'+(filteredSources.length!==1?'s':'')+(filterTag?' -- filtered by '+filterTag:'')+(annOnly?' -- annotated only':'')
        ),
        filteredSources.length===0&&e('div',{style:{color:'#6e7681',fontSize:13,fontStyle:'italic',padding:'20px 0'}},'No sources match current filters.'),
        filteredSources.map(function(src){return SourceCard(src,selSrc&&selSrc.id,function(s){setSelSrc(selSrc&&selSrc.id===s.id?null:s);},curLayer.color);})
      ),
      selSrc&&DetailPanel(selSrc, curLayer.color, function(){setSelSrc(null);})
    )
  );

  // CLAIMS VIEW
  var claimAccent=selClaim?LAYER_MAP[selClaim.layer_home].color:'#6e7681';
  var claimsView=e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
    e('div',{style:{padding:'13px 18px 11px',borderBottom:'1px solid #21262d',background:'#0d1117',flexShrink:0}},
      selClaim?e('div',null,
        e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
          e('div',{style:{width:7,height:7,borderRadius:'50%',background:claimAccent,boxShadow:'0 0 8px '+claimAccent,flexShrink:0}}),
          e('span',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.1em',color:claimAccent,textTransform:'uppercase'}},selClaim.id.toUpperCase()+' -- ESF Claim')
        ),
        e('h2',{style:{margin:'0 0 6px',fontSize:16,fontWeight:600,color:'#e6edf3',letterSpacing:'-0.01em'}},selClaim.label),
        e('p',{style:{margin:0,fontSize:13,color:'#8b949e',lineHeight:1.6}},selClaim.description)
      ):e('div',null,
        e('h2',{style:{margin:'0 0 4px',fontSize:16,fontWeight:600,color:'#e6edf3'}},'ESF Claim Map'),
        e('p',{style:{margin:0,fontSize:13,color:'#8b949e',fontStyle:'italic'}},'Select a claim from the left panel to see supporting sources across all layers.')
      )
    ),
    e('div',{style:{display:'flex',flex:1,overflow:'hidden'}},
      selClaim?e('div',{style:{width:selSrc?'42%':'100%',overflowY:'auto',padding:'11px 14px',transition:'width .25s'}},
        e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#6e7681',marginBottom:9,letterSpacing:'0.06em'}},
          claimSources.length+' source'+(claimSources.length!==1?'s':'')+' across '+[...new Set(claimSources.map(function(s){return s.layer;}))].length+' layer'+(([...new Set(claimSources.map(function(s){return s.layer;}))].length!==1)?'s':'')
        ),
        claimSources.map(function(src){return SourceCard(src,selSrc&&selSrc.id,function(s){setSelSrc(selSrc&&selSrc.id===s.id?null:s);},claimAccent);})
      ):e('div',{style:{flex:1,overflowY:'auto',padding:'30px 20px'}},
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,maxWidth:800}},
          CLAIMS.map(function(claim){
            var layer=LAYER_MAP[claim.layer_home];
            var srcCount=SOURCES.filter(function(s){return s.claims&&s.claims.indexOf(claim.id)>=0;}).length;
            return e('div',{key:claim.id,className:'ccard',onClick:function(){setSelClaim(claim);setSelSrc(null);},style:{borderColor:'rgba('+rgb(layer.color)+',.2)',background:'rgba('+rgb(layer.color)+',.04)'}},
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:6}},
                e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:layer.color,letterSpacing:'0.08em'}},claim.id.toUpperCase()),
                e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681',flexShrink:0}},srcCount+' src')
              ),
              e('div',{style:{fontSize:13,fontWeight:600,color:'#e6edf3',lineHeight:1.4,marginBottom:6}},claim.label),
              e('div',{style:{fontSize:11,color:'#8b949e',lineHeight:1.5}},claim.description.substring(0,90)+'...')
            );
          })
        )
      ),
      selSrc&&DetailPanel(selSrc, claimAccent, function(){setSelSrc(null);})
    )
  );

  return e('div',{style:{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}},
    showAbout&&e(AboutPanel,{onClose:function(){setShowAbout(false);}}),
    // HEADER
    e('div',{style:{padding:'12px 22px 11px',borderBottom:'1px solid #21262d',background:'#161b22',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
      e('div',{style:{display:'flex',alignItems:'center',gap:12}},
        e('div',{style:{width:28,height:28,borderRadius:'50%',background:'#0d1117',border:'1.5px solid #4FC3F7',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          e('div',{className:'dot-pulse',style:{background:'#4FC3F7',width:6,height:6}})
        ),
        e('div',null,
          e('div',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:'0.12em',color:'#6e7681',textTransform:'uppercase',marginBottom:1}},
            e('a',{href:'https://ndstress.org',target:'_blank',rel:'noopener',style:{color:'#6e7681'}},'Center for Adaptive Stress'),' -- ndstress.org'
          ),
          e('h1',{style:{margin:0,fontSize:16,fontWeight:600,letterSpacing:'-0.01em',color:'#e6edf3'}},'ESF Rosetta Stone Map')
        )
      ),
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('div',{style:{display:'flex',gap:5,alignItems:'center'}},
          e('button',{className:'modetab',onClick:function(){switchMode('sources');},style:{color:mode==='sources'?'#e6edf3':'#8b949e',background:mode==='sources'?'#21262d':'transparent',borderColor:mode==='sources'?'#4FC3F7':'#30363d'}},'Sources'),
          e('button',{className:'modetab',onClick:function(){switchMode('claims');},style:{color:mode==='claims'?'#e6edf3':'#8b949e',background:mode==='claims'?'#21262d':'transparent',borderColor:mode==='claims'?'#d2a679':'#30363d'}},'Claims')
        ),
        e('div',{style:{display:'flex',gap:6,alignItems:'center',borderLeft:'1px solid #21262d',paddingLeft:10}},
          LAYERS.map(function(l){return e('div',{key:l.id,title:'Layer '+l.id+': '+l.shortName,onClick:function(){switchMode('sources');selectLayer(l.id);},style:{width:8,height:8,borderRadius:'50%',background:l.color,cursor:'pointer',opacity:(mode==='sources'&&l.id===selLayer)?1:.3,transition:'all .2s',boxShadow:(mode==='sources'&&l.id===selLayer)?'0 0 10px '+l.color:'none'}});})
        ),
        e('button',{onClick:function(){setShowAbout(true);},style:{background:'transparent',border:'1px solid #30363d',borderRadius:4,color:'#8b949e',cursor:'pointer',padding:'4px 11px',fontFamily:"'JetBrains Mono',monospace",fontSize:10,transition:'all .15s',marginLeft:4}},'About')
      )
    ),
    // BODY
    e('div',{style:{display:'flex',flex:1,overflow:'hidden'}},
      sidebar,
      mode==='sources'?sourcesView:claimsView
    ),
    // FOOTER
    e('div',{style:{padding:'5px 20px',borderTop:'1px solid #21262d',background:'#161b22',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
      e('span',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681',letterSpacing:'0.06em'}},'Evolutionary Stress Framework -- Phase 1+2 Evidence Map -- Center for Adaptive Stress 2025-26'),
      e('a',{href:'https://evostress.blog',target:'_blank',rel:'noopener',style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#6e7681'}},'evostress.blog')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
