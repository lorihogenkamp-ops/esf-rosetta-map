*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:#0d1117;font-family:'Crimson Text',Georgia,serif;color:#c9d1d9;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#161b22}::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
.lbtn{transition:all .2s;cursor:pointer;border:none;text-align:left;padding:11px 13px;border-radius:6px;margin-bottom:3px;background:transparent;width:100%;font-family:inherit}
.lbtn:hover{background:rgba(255,255,255,.04)}
.scard{transition:all .18s;cursor:pointer;border-radius:7px;padding:13px;margin-bottom:7px;border:1px solid #21262d;background:#161b22}
.scard:hover{border-color:#30363d;background:#1c2128;transform:translateY(-1px)}
.ccard{transition:all .18s;cursor:pointer;border-radius:7px;padding:14px;margin-bottom:8px;border:1px solid #21262d;background:#161b22}
.ccard:hover{border-color:#30363d;background:#1c2128;transform:translateY(-1px)}
.chip{display:inline-block;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;margin-right:3px;margin-bottom:3px;border:1px solid transparent;transition:opacity .15s}
.ftag{cursor:pointer;padding:3px 9px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #30363d;background:transparent;transition:all .15s;font-weight:500}
.ftag:hover{border-color:#6e7681}
.dsec{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #21262d}
.dsec:last-child{border-bottom:none}
.cbtn{background:#21262d;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;transition:all .15s;flex-shrink:0}
.cbtn:hover{background:#30363d;color:#c9d1d9}
.badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;flex-shrink:0}
.modetab{cursor:pointer;padding:5px 13px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid #30363d;background:transparent;transition:all .2s;letter-spacing:.04em;color:#8b949e}
.modetab:hover{border-color:#6e7681;color:#c9d1d9}
input[type=text]{outline:none}
.about-panel{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
.about-box{background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:600px;width:90%;padding:36px 40px;position:relative;max-height:90vh;overflow-y:auto}
.dot-pulse{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
</style>

<script id="esf-data" type="application/json">{"layers": [{"id": 1, "name": "Foundational Regulation Theory", "shortName": "Regulation", "color": "#4FC3F7", "glow": "rgba(79,195,247,0.3)", "question": "How do organisms regulate themselves across uncertainty, time, and changing environments?", "domains": ["Allostasis", "Predictive processing / active inference", "Interoception", "Energy allocation", "Complex adaptive systems"]}, {"id": 2, "name": "Biological Mechanisms of Stress Adaptation", "shortName": "Mechanisms", "color": "#A5D6A7", "glow": "rgba(165,214,167,0.3)", "question": "Through what mechanisms does stress reorganize the organism?", "domains": ["Mitochondria & cellular energetics", "HPA-axis / neuroendocrine", "Immune regulation", "Oxidative stress / redox", "Gut-brain signaling", "Autonomic regulation"]}, {"id": 3, "name": "Developmental Calibration & Plasticity", "shortName": "Development", "color": "#FFCC80", "glow": "rgba(255,204,128,0.3)", "question": "How do early conditions shape later regulatory style, sensitivity, and vulnerability?", "domains": ["Developmental plasticity", "Differential susceptibility", "Adaptive calibration", "Prenatal & early-life stress", "Epigenetics & transgenerational effects"]}, {"id": 4, "name": "Emergence, Complexity & Network Medicine", "shortName": "Complexity", "color": "#CE93D8", "glow": "rgba(206,147,216,0.3)", "question": "How do complex organism-environment networks generate stable or unstable patterns?", "domains": ["Network medicine", "Complex adaptive systems", "Self-organization", "Attractor dynamics", "Multimorbidity as network disturbance"]}, {"id": 5, "name": "Neurodiversity, Disability & Human Variation", "shortName": "Neurodiversity", "color": "#F48FB1", "glow": "rgba(244,143,177,0.3)", "question": "How do we interpret variation without collapsing back into deficit models?", "domains": ["Neurodiversity paradigm", "Social & relational disability models", "Double empathy", "Monotropism", "Identity, masking, burnout", "Human variation & specialization"]}, {"id": 6, "name": "Evolution, Ecology & Population-Level Diversity", "shortName": "Evolution", "color": "#80DEEA", "glow": "rgba(128,222,234,0.3)", "question": "Why would variation in stress responsivity persist or matter at the population level?", "domains": ["Evolution under environmental stress", "Developmental systems theory", "Niche construction", "Social-ecological systems", "Cooperative cognition", "Functional & response diversity"]}], "tags": {"REG": {"label": "REG", "title": "Regulation / allostasis", "color": "#4FC3F7"}, "INT": {"label": "INT", "title": "Interoception", "color": "#81D4FA"}, "PP": {"label": "PP", "title": "Predictive processing / active inference", "color": "#4FC3F7"}, "EN": {"label": "EN", "title": "Energy metabolism / bioenergetics", "color": "#A5D6A7"}, "STR": {"label": "STR", "title": "Stress physiology", "color": "#FFCC80"}, "DEV": {"label": "DEV", "title": "Developmental calibration / plasticity", "color": "#FFB74D"}, "EPI": {"label": "EPI", "title": "Epigenetics / transgenerational", "color": "#FFCC80"}, "NET": {"label": "NET", "title": "Complexity / network medicine", "color": "#CE93D8"}, "ND": {"label": "ND", "title": "Neurodiversity / disability / lived experience", "color": "#F48FB1"}, "EVO": {"label": "EVO", "title": "Evolution / ecology / niche construction", "color": "#80DEEA"}, "SOC": {"label": "SOC", "title": "Social buffering / relational regulation", "color": "#B39DDB"}, "CLIN": {"label": "CLIN", "title": "Clinical translation / biomarkers", "color": "#80CBC4"}, "METH": {"label": "METH", "title": "Methodological / epistemic critique", "color": "#BCAAA4"}}, "claims": [{"id": "c01", "label": "Regulation is predictive, not reactive", "description": "Organisms continuously generate predictions about internal and external states to guide regulation. Stress is a disturbance in predictive regulation, not merely a response to insult.", "layer_home": 1}, {"id": "c02", "label": "Health is emergent allostasis, not static equilibrium", "description": "Health is the ongoing achievement of adaptive coordination across changing conditions, not the maintenance of a fixed set-point or the absence of stress.", "layer_home": 1}, {"id": "c03", "label": "Stress is informational calibration, not only damage", "description": "Stress serves an organizational and informational function in biological development. It shapes regulatory style, sensitivity, and adaptive strategy before becoming load.", "layer_home": 3}, {"id": "c04", "label": "Interoception is central to regulation and self-modeling", "description": "The brain's predictive model of the body's internal state is foundational to emotion, cognition, identity, and adaptive behavior -- not peripheral to them.", "layer_home": 1}, {"id": "c05", "label": "Bioenergetics are central to stress adaptation", "description": "Stress is materially instantiated in energy systems. Mitochondria transduce psychosocial signals into cellular energy changes, making stress an energetic as well as psychological phenomenon.", "layer_home": 2}, {"id": "c06", "label": "Stress responsivity is developmentally calibrated", "description": "Variation in stress responsivity reflects patterned developmental calibration to local conditions, not simply healthy vs. unhealthy states. Similar stressors can produce divergent adaptive outcomes.", "layer_home": 3}, {"id": "c07", "label": "Conditions are network states, not single-cause entities", "description": "Disease and neurodevelopmental conditions emerge from perturbations in interacting biological and social networks. Multimorbidity reflects connected system disturbance, not unrelated coincidence.", "layer_home": 4}, {"id": "c08", "label": "Autism reflects emergent heterogeneity, not a singular pathology", "description": "Autism cannot be explained by one cause, one mechanism, or one deficit. It is better modeled as an emergent developmental manifold -- a family of regulatory trajectories sharing some attractors.", "layer_home": 4}, {"id": "c09", "label": "Neurodiversity is contextual and ecological, not merely intrapersonal", "description": "Functional difference cannot be read outside context. Social environments, ecological fit, and organism-niche relationships are part of what makes a trait adaptive, disabling, or somewhere in between.", "layer_home": 5}, {"id": "c10", "label": "Burnout reflects regulatory depletion and demand-resource mismatch", "description": "Autistic burnout is a regulatory exhaustion state arising from cumulative adaptation cost, masking load, and demand-resource imbalance -- not merely a psychiatric comorbidity.", "layer_home": 5}, {"id": "c11", "label": "Cooperative neurodiversity serves population-level function", "description": "Variation in cognition, stress responsivity, and regulatory style may serve a collective adaptive function -- distributed across a population like response diversity in ecological systems.", "layer_home": 6}, {"id": "c12", "label": "Social environments are part of regulatory architecture", "description": "Regulation is not only intrapersonal. Attachment, co-regulation, social buffering, and niche construction are constitutive parts of the regulatory system, not external supports.", "layer_home": 5}, {"id": "c13", "label": "Sensitivity is bidirectional, not only vulnerability", "description": "Higher environmental sensitivity can confer greater benefit under supportive conditions as well as greater cost under adverse ones. Vulnerability and potential are linked, not separable.", "layer_home": 3}, {"id": "c14", "label": "Organisms co-construct their regulatory niches", "description": "Organisms do not merely adapt to environments; they actively shape the environments that make their own regulation possible. Niche construction is part of adaptive strategy.", "layer_home": 6}], "sources": [{"id": "barrett-simmons-2015", "layer": 1, "annotated": true, "citation": "Barrett & Simmons (2015)", "full": "Barrett, Lisa Feldman, and W. Kyle Simmons. 2015. Interoceptive Predictions in the Brain. Nature Reviews Neuroscience 16(7): 419-29.", "tags": ["INT", "PP", "REG", "EN"], "claims": ["c04", "c01", "c02"], "argues": "The brain continuously generates predictions about internal bodily states and uses these to guide regulation. Interoception is not passive sensation but part of an anticipatory control architecture tied to action, feeling, and bodily need.", "esf": "One of the clearest anchors for the ESF claim that the organism is not primarily a thinking machine but a predictive regulatory system. Supports the view that cognition, affect, and bodily regulation are integrated rather than separable domains.", "supports": ["The brain is fundamentally engaged in predictive allostatic regulation", "Interoception is central to experience, not secondary to cognition", "Stress can be analyzed as a disturbance in predictive regulation"], "limits": "Theoretical and neuroscientific; does not by itself establish how these mechanisms vary across neurotypes or developmental histories.", "next": "Build ESF arguments about emotion, uncertainty, and regulation. Link interoception to autism heterogeneity, burnout, and stress sensitivity. Foundational citation for introductions and conceptual papers."}, {"id": "mcewen-wingfield-2003", "layer": 1, "annotated": true, "citation": "McEwen & Wingfield (2003)", "full": "McEwen, Bruce S., and John C. Wingfield. 2003. The Concept of Allostasis in Biology and Biomedicine. Hormones and Behavior 43(1): 2-15.", "tags": ["REG", "STR", "EN", "EVO"], "claims": ["c02", "c01", "c03"], "argues": "Introduces allostasis as regulatory stability through change -- the organism actively anticipates and responds to demand rather than passively restoring equilibrium. Distinguishes allostasis from homeostasis.", "esf": "The definitional foundation for ESF's regulatory language. Reframes stress as adaptive engagement with demand rather than deviation from a fixed normal state. Health is dynamic regulation under changing conditions, not mere maintenance of an average set point.", "supports": ["Health is adaptive regulation, not static equilibrium", "Stress physiology is part of normal biological design, not only pathology", "Trade-offs are inherent to adaptation"], "limits": "Opens the door to a broader framework but does not fully integrate interoception, predictive processing, or neurodiversity.", "next": "Use as foundational citation in any ESF introduction. Pair with Sterling, Barrett, and Picard to show the evolution from allostasis to predictive embodied regulation."}, {"id": "sterling-2012", "layer": 1, "annotated": true, "citation": "Sterling (2012)", "full": "Sterling, Peter. 2012. Allostasis: A Model of Predictive Regulation. Physiology & Behavior 106(1): 5-15.", "tags": ["REG", "PP", "INT", "EN"], "claims": ["c01", "c02", "c03"], "argues": "Reframes allostasis explicitly as predictive regulation. The organism anticipates need and allocates resources prospectively rather than waiting passively for error correction.", "esf": "Essential for the ESF argument that stress is not just a response to insult but part of the organism's continuous effort to manage uncertainty, need, opportunity, and cost. Helps prevent the framework from being interpreted as reactive damage science.", "supports": ["Regulation is predictive", "Organisms are designed around energetic anticipation", "Stress belongs inside a broader regulatory model"], "limits": "Gives a strong conceptual basis, but ESF still needs additional layers to address development, heterogeneity, and condition-specific trajectories.", "next": "Stronger framing of emergent allostasis. Better articulation of why prediction matters more than average norms."}, {"id": "friston-2010", "layer": 1, "annotated": true, "citation": "Friston (2010)", "full": "Friston, Karl. 2010. The Free-Energy Principle: A Unified Brain Theory? Nature Reviews Neuroscience 11(2): 127-38.", "tags": ["PP", "REG", "EN"], "claims": ["c01", "c04"], "argues": "Biological systems minimize surprise (free energy) by either updating their models of the world or acting to make the world match their predictions. Unifies perception, action, and learning under a single framework.", "esf": "Provides formal theoretical grounding for the ESF view that organisms are model-based predictive regulators. Active inference extends this to behavior, stress responses, and development.", "supports": ["Organisms are self-organizing prediction systems", "Stress represents unresolved prediction error under energetic constraint"], "limits": "Highly mathematical; requires ESF translation for clinical and advocacy audiences.", "next": "Link active inference to interoception, autistic perception, and burnout models."}, {"id": "quigley-2021", "layer": 1, "annotated": true, "citation": "Quigley et al. (2021)", "full": "Quigley, Karen S., Scott Kanoski, Warren M. Grill, Lisa Feldman Barrett, and Manos Tsakiris. 2021. Functions of Interoception: From Energy Regulation to Experience of the Self. Trends in Neurosciences 44(1): 29-38.", "tags": ["INT", "EN", "REG", "SOC"], "claims": ["c04", "c02", "c12"], "argues": "Broadens interoception beyond sensing internal signals -- it plays roles in energy regulation, motivation, emotion, selfhood, and social functioning. Interoception is a multi-level integrative function, not a single sensory channel.", "esf": "Helps translate interoception from a niche topic into a central organizing principle. Supports ESF's effort to connect body regulation, identity, affect, and adaptive behavior without splitting them into separate silos.", "supports": ["Interoception is foundational to self and regulation", "Energy management and subjective experience are linked", "Social and emotional life are inseparable from body-state modeling"], "limits": "Integrative framing benefits from pairing with disorder- or phenotype-specific literature when making clinical claims.", "next": "Stronger ESF language around identity, coherence, and self-trust. Bridges to autistic burnout and timing/predictability work."}, {"id": "kleckner-2017", "layer": 1, "annotated": true, "citation": "Kleckner et al. (2017)", "full": "Kleckner, Ian R., et al. 2017. Evidence for a Large-Scale Brain System Supporting Allostasis and Interoception in Humans. Nature Human Behaviour 1(5): 0069.", "tags": ["INT", "REG", "NET", "EN"], "claims": ["c04", "c01", "c07"], "argues": "Presents evidence for a large-scale neural system integrating allostasis and interoception. Rather than localized functions, regulation emerges through distributed networks linking bodily prediction and coordinated action.", "esf": "Strengthens ESF neuroanatomically. ESF argues that regulation is distributed and integrated, and this paper provides concrete support for that claim at the network level.", "supports": ["Allostasis and interoception depend on distributed brain-body networks", "Regulation is a systems phenomenon, not a single-region function", "Neural organization reflects energetic priorities"], "limits": "Network framing is highly useful but translation to lived heterogeneity requires additional developmental and ecological layers.", "next": "Stronger diagrams of allostatic-interoceptive network organization. Better support for claims about autism as network-level difference rather than isolated deficit."}, {"id": "picard-en-2018", "layer": 1, "annotated": true, "citation": "Picard, McEwen, Epel & Sandi (2018)", "full": "Picard, Martin, Bruce S. McEwen, Elissa S. Epel, and Carmen Sandi. 2018. An Energetic View of Stress: Focus on Mitochondria. Frontiers in Neuroendocrinology 49: 72-85.", "tags": ["STR", "EN", "REG", "CLIN"], "claims": ["c05", "c02", "c03"], "argues": "Reframes stress in explicitly energetic terms, with mitochondria as central mediators of adaptation and cost. Connects psychological, neural, endocrine, and cellular domains through bioenergetic logic.", "esf": "One of the most important papers for making ESF biologically legible to skeptics. Shows that energy is not metaphorical but materially embedded in regulatory systems.", "supports": ["Stress is an energetic process", "Bioenergetics are central to adaptation, not a downstream footnote", "Chronic dysregulation can be understood as accumulated energetic cost"], "limits": "As with many integrative papers, direct phenotype-specific conclusions require supplemental studies.", "next": "Mechanistic support for ESF discussions of fatigue, burnout, and multimorbidity. Strong bridge to autism metabolism and mitochondrial literature."}, {"id": "sturmberg-2019", "layer": 1, "annotated": true, "citation": "Sturmberg et al. (2019)", "full": "Sturmberg, Joachim P., et al. 2019. Health and Disease -- Emergent States Resulting from Adaptive Social and Biological Network Interactions. Frontiers in Medicine 6: 59.", "tags": ["NET", "REG", "SOC", "CLIN"], "claims": ["c02", "c07", "c12"], "argues": "Models health and disease as emergent states arising from adaptive social and biological network interactions. Challenges simple biomedical reductionism and emphasizes dynamic state organization.", "esf": "One of the most direct complexity-medicine allies for ESF. Supports the idea that disease is not a thing the organism has but a system state the organism enters.", "supports": ["Health and disease are emergent adaptive states", "Social and biological levels must be modeled together", "Static normal-vs-pathological binaries are insufficient"], "limits": "Framework is highly compatible with ESF, but ESF adds more explicit emphasis on neurodiversity and stress-language integration.", "next": "Direct support for emergent-allostasis language. Better bridges from theory to clinical reframing."}, {"id": "picard-mcewen-2018", "layer": 2, "annotated": true, "citation": "Picard & McEwen (2018)", "full": "Picard, Martin, and Bruce S. McEwen. 2018. Psychological Stress and Mitochondria: A Conceptual Framework. Psychosomatic Medicine 80(2): 126-40.", "tags": ["STR", "EN", "REG", "CLIN"], "claims": ["c05", "c08", "c10"], "argues": "Bidirectional relationships exist between mitochondria and psychological stress -- mitochondria both mediate and are shaped by stress responses. Reframes stress as an energetic, cellular, and systemic phenomenon.", "esf": "One of the strongest mechanistic bridges between psychological stress language and cellular bioenergetics. It gives ESF one of its cleanest mechanistic bridges between mind, body, and cellular adaptation.", "supports": ["Mitochondria are central actors in stress adaptation", "Stress effects are systemic because energy systems are systemic", "Symptoms can reflect distributed energetic reorganization"], "limits": "Conceptual paper; needs connection to developmental calibration and social context for a full ESF reading.", "next": "A robust energy-regulation subsection in papers and talks. Stronger links to neurodevelopmental heterogeneity and chronic illness."}, {"id": "bobba-alves-2022", "layer": 2, "annotated": true, "citation": "Bobba-Alves et al. (2022)", "full": "Bobba-Alves, Natalia, Robert-Paul Juster, and Martin Picard. 2022. The Energetic Cost of Allostasis and Allostatic Load. Psychoneuroendocrinology 146: 105951.", "tags": ["EN", "STR", "REG", "CLIN"], "claims": ["c05", "c02", "c10"], "argues": "Quantifies the metabolic cost of allostatic regulation and load -- demonstrates that chronic stress is energetically expensive at the cellular level.", "esf": "Direct empirical support for the ESF claim that regulatory demands have real metabolic costs, and that allostatic overload depletes adaptive capacity.", "supports": ["Regulatory bandwidth is measurable and finite", "Chronic dysregulation has quantifiable energetic consequences"], "limits": "Specific populations; generalization to neurodevelopmental contexts requires care.", "next": "Use as empirical anchor for ESF Paper 3's Regulatory Bandwidth construct."}, {"id": "naviaux-2023", "layer": 2, "annotated": true, "citation": "Naviaux (2023)", "full": "Naviaux, Robert K. 2023. Mitochondrial and Metabolic Features of Salugenesis and the Healing Cycle. Mitochondrion 70: 131-63.", "tags": ["EN", "STR", "CLIN", "NET"], "claims": ["c02", "c05", "c07"], "argues": "Describes healing and disease as dynamic metabolic processes rather than simple return to a previous normal. Emphasizes staged recovery, signaling, and system-wide metabolic transitions.", "esf": "Aligns closely with emergent allostasis over static health. Supports the idea that recovery is not a linear reversal but a reorganizing process across time and levels.", "supports": ["Health and recovery are dynamic transitions", "Metabolic state shifts can organize symptom patterns", "Disease and healing should be modeled as processes, not categories"], "limits": "Powerful but can be interpreted too universally unless contextualized with neurodiversity and ecological difference.", "next": "Better ESF language around healing cycles and regulatory transitions. Bridges between metabolism, developmental trajectory, and chronic symptoms."}, {"id": "frye-biomarkers-2024", "layer": 2, "annotated": true, "citation": "Frye et al. (2024) -- biomarker meta-analysis", "full": "Frye, Richard E., Nicole Rincon, Patrick J. McCarty, Danielle Brister, Adrienne C. Scheck, and Daniel A. Rossignol. 2024. Biomarkers of Mitochondrial Dysfunction in Autism Spectrum Disorder: A Systematic Review and Meta-Analysis. Neurobiology of Disease 194: 106470.", "tags": ["EN", "CLIN", "ND", "NET"], "claims": ["c05", "c08"], "argues": "Reviews biomarkers associated with mitochondrial dysfunction in autism and finds evidence of altered bioenergetic function across studies.", "esf": "Gives empirical weight to the claim that autism cannot be treated as merely behavioral. Supports the ESF argument that many autistic presentations involve distributed organism-level regulation differences, including metabolic and energetic dimensions.", "supports": ["Bioenergetic alteration is relevant in autism research", "Autism heterogeneity includes physiological and metabolic variation", "Mechanistic models must extend beyond cognition and behavior"], "limits": "Meta-analyses aggregate heterogeneous populations and should not be interpreted as supporting a single autism mechanism.", "next": "Strong empirical support for energy-centered autism models. Better integration with metabolomics and regression findings."}, {"id": "frye-regression-2024", "layer": 2, "annotated": true, "citation": "Frye et al. (2024) -- regression", "full": "Frye, Richard E., Patrick J. McCarty, Brianna A. Werner, Shannon Rose, and Adrienne C. Scheck. 2024. Bioenergetic Signatures of Neurodevelopmental Regression. Frontiers in Physiology 15: 1306038.", "tags": ["EN", "DEV", "CLIN", "ND"], "claims": ["c05", "c06", "c08"], "argues": "Identifies bioenergetic signatures associated with neurodevelopmental regression, suggesting links between altered metabolism and developmental change or decline.", "esf": "Supports the idea that developmental shifts may reflect changing regulatory capacity and energetic tipping points rather than mysterious categorical events.", "supports": ["Developmental regression may involve energetic reorganization", "Trajectory shifts can be studied as state transitions", "Regulatory thresholds matter in neurodevelopment"], "limits": "Regression is multifactorial; metabolic findings should be integrated with developmental, immune, and ecological context.", "next": "A nuanced ESF model of regression. Better explanations of phase shifts, bandwidth loss, and developmental tipping points."}, {"id": "lingampelly-2024", "layer": 2, "annotated": true, "citation": "Lingampelly et al. (2024)", "full": "Lingampelly, Sai Sachin, Jane C. Naviaux, Luke S. Heuer, Jonathan M. Monk, Kefeng Li, Lin Wang, Lori Haapanen, Chelsea A. Kelland, Judy Van de Water, and Robert K. Naviaux. 2024. Metabolic Network Analysis of Pre-ASD Newborns and 5-Year-Old Children with Autism Spectrum Disorder. Communications Biology 7: 536.", "tags": ["EN", "DEV", "NET", "ND"], "claims": ["c05", "c08", "c06"], "argues": "Uses metabolic network analysis to identify differences in newborns later associated with autism and in children with autism, suggesting early metabolic organization may be relevant to developmental trajectories.", "esf": "Highly useful because it points toward developmental trajectory and network-state differences without reducing autism to a single prenatal cause. Supports emphasis on initial conditions, calibration, and emergent trajectory.", "supports": ["Early metabolic organization may shape later developmental pathways", "Autism can be studied as an emergent trajectory rather than a late-appearing discrete category", "Network-level metabolism matters"], "limits": "Such findings should not be overread as destiny; ESF should emphasize developmental plasticity and context.", "next": "Stronger early-development sections in ESF autism work. Bridges to initial conditions, trajectory, and manifold models."}, {"id": "smith-2023", "layer": 2, "annotated": true, "citation": "Smith et al. (2023)", "full": "Smith, Alan M., Elizabeth L. R. Donley, Denise M. Ney, David G. Amaral, Robert E. Burrier, and Marvin R. Natowicz. 2023. Metabolomic Biomarkers in Autism: Identification of Complex Dysregulations of Cellular Bioenergetics. Scientific Reports 13: 12371.", "tags": ["EN", "CLIN", "NET", "ND"], "claims": ["c05", "c08", "c07"], "argues": "Identifies metabolomic biomarker patterns suggesting complex dysregulation of cellular bioenergetics in autism.", "esf": "Reinforces the view that autism-related biology often appears as distributed metabolic patterning rather than single lesions. Exactly the kind of evidence ESF needs to support a systems model.", "supports": ["Autism biology includes system-level metabolic patterning", "Complex dysregulation is more informative than one-biomarker hunting", "Energy-centered models fit the evidence better than purely behavioral ones"], "limits": "Metabolomic profiles are often difficult to interpret without careful attention to subgrouping and context.", "next": "Strong support for biomarker layering in ESF proposals. Better links between metabolism, chronic illness, and neurotype expression."}, {"id": "dubois-2016", "layer": 2, "annotated": true, "citation": "DuBois et al. (2016)", "full": "DuBois, Denise, Stephanie H. Ameis, Meng-Chuan Lai, Manuel F. Casanova, and Pushpal Desarkar. 2016. Interoception in Autism Spectrum Disorder: A Review. International Journal of Developmental Neuroscience 52: 104-11.", "tags": ["INT", "ND", "REG", "CLIN"], "claims": ["c04", "c08", "c09"], "argues": "Surveys evidence on interoception in autism and highlights mixed findings across awareness, accuracy, and interpretation of internal bodily signals. Points toward heterogeneity and measurement complexity rather than a simple global deficit model.", "esf": "Useful because it keeps ESF from oversimplifying autism-interoception relationships. Supports the idea that autistic differences may involve distinct interoceptive styles, calibration issues, or context-dependent patterns rather than one universal impairment.", "supports": ["Interoception in autism is heterogeneous", "Internal sensing and interpretation are part of autistic regulatory differences", "Measurement frameworks matter -- different interoceptive dimensions can diverge"], "limits": "Literature was early at time of writing. Should be paired with later work on interoceptive dimensions and predictive frameworks.", "next": "Stronger ESF treatment of interoceptive diversity. Better framing for emotion, uncertainty, alexithymia, and overload."}, {"id": "garfinkel-2016", "layer": 2, "annotated": true, "citation": "Garfinkel et al. (2016)", "full": "Garfinkel, Sarah N., Claire Tiley, Stephanie O'Keeffe, Neil A. Harrison, Anil K. Seth, and Hugo D. Critchley. 2016. Discrepancies between Dimensions of Interoception in Autism: Implications for Emotion and Anxiety. Biological Psychology 114: 117-26.", "tags": ["INT", "ND", "REG", "CLIN"], "claims": ["c04", "c08", "c10"], "argues": "Shows that different dimensions of interoception -- objective accuracy, subjective sensibility, and metacognitive insight -- can come apart in autistic individuals. These discrepancies may be relevant to emotion and anxiety patterns.", "esf": "One of the most important papers for preventing simplistic claims about poor interoception. ESF can use it to argue that regulatory differences often emerge from mismatches between sensing, interpreting, and trusting internal signals.", "supports": ["Interoception is multidimensional", "Regulatory difficulty may arise from mismatch across interoceptive layers, not only low signal access", "Anxiety and emotion differences may reflect disrupted self-model calibration"], "limits": "Interpretation can drift toward deficit language if not situated within broader autistic heterogeneity and ecological context.", "next": "A more precise ESF model of interoceptive divergence. Better integration of alexithymia, stress sensitivity, and self-assessment difficulties."}, {"id": "loureiro-2024", "layer": 2, "annotated": true, "citation": "Loureiro et al. (2024)", "full": "Loureiro, F., S. M. Ringold, and L. Aziz-Zadeh. 2024. Interoception in Autism: A Narrative Review of Behavioral and Neurobiological Data. Frontiers in Psychology 15: 1369005.", "tags": ["INT", "ND", "NET", "CLIN"], "claims": ["c04", "c08", "c09"], "argues": "Updates the interoception-in-autism literature by integrating behavioral and neurobiological data. Reinforces heterogeneity and highlights the difficulty of drawing singular conclusions across studies using different tasks and definitions.", "esf": "Helps ESF stay current while supporting the claim that autism research often struggles because it is trying to force nonlinear diversity into linear summary categories.", "supports": ["Autism heterogeneity appears clearly in interoceptive findings", "Interoception should be studied across multiple levels, not as a single trait", "Better models are needed to explain diverse regulatory profiles"], "limits": "Narrative reviews need to be paired with specific mechanistic and ecological studies.", "next": "Stronger literature reviews in ESF writing. Better justification for multidimensional interoceptive frameworks."}, {"id": "itoi-2024", "layer": 2, "annotated": true, "citation": "Itoi et al. (2024)", "full": "Itoi, Chihiro, Yuta Ujiie, Yuuki Ooishi, and Makio Kashino. 2024. The Relationship between Subjective Difficulty in Interoceptive Processing and Accuracy of Heartbeat Perception in Autistic Individuals. Autism Research 17(4): 703-15.", "tags": ["INT", "ND", "REG", "CLIN"], "claims": ["c04", "c08"], "argues": "Examines the relationship between subjective difficulty in interoceptive processing and objective heartbeat perception in autistic individuals, highlighting that felt difficulty and measured accuracy do not always align neatly.", "esf": "Supports a core ESF point: lived regulation cannot be inferred from a single metric. A person may perform one task adequately while still experiencing substantial regulatory friction in daily life.", "supports": ["Subjective and objective regulation measures can diverge", "Daily lived difficulty matters as much as task performance", "Autism research needs multi-level assessment"], "limits": "Heartbeat tasks capture only one narrow part of interoception and should not be overgeneralized.", "next": "Better ESF justification for combining biomarkers, EMA, and self-report. A stronger bridge between lab measures and real-world regulation."}, {"id": "mahony-2022", "layer": 2, "annotated": true, "citation": "Mahony & O'Ryan (2022)", "full": "Mahony, Caitlyn, and Colleen O'Ryan. 2022. A Molecular Framework for Autistic Experiences: Mitochondrial Allostatic Load as a Mediator between Autism and Psychopathology. Frontiers in Psychiatry 13: 752210.", "tags": ["EN", "STR", "ND", "NET", "CLIN"], "claims": ["c05", "c10", "c08"], "argues": "Proposes mitochondrial allostatic load as a mechanism linking autistic experience and psychopathology. Offers a bioenergetic interpretation for why autistic individuals may face elevated downstream mental and physical health burdens under chronic stress.", "esf": "Exceptionally aligned with ESF. Offers a mechanistic bridge from lived autistic stress burden to cellular energy cost, helping explain why autistic distress often becomes distributed across multiple domains.", "supports": ["Autistic stress burden may be biologically embodied through bioenergetic cost", "Psychopathology and physical burden may share energetic pathways", "Mitochondrial allostatic load can connect neurodiversity and health inequity"], "limits": "Framework is promising but still conceptual; needs more empirical integration with multimorbidity and developmental data.", "next": "One of the strongest mechanistic subsections for ESF autism papers. A direct bridge between autism, burnout, chronic illness, and stress biology."}, {"id": "hughes-2023", "layer": 2, "annotated": false, "citation": "Hughes et al. (2023)", "full": "Hughes, H.K., R.J. Moreno, and P. Ashwood. 2023. Innate Immune Dysfunction and Neuroinflammation in Autism Spectrum Disorder. Brain, Behavior, and Immunity 108: 245-54.", "tags": ["STR", "CLIN", "NET"], "claims": ["c07", "c08"], "argues": "Reviews evidence for innate immune dysfunction and neuroinflammatory patterns across ASD -- identifies these as mechanistic contributors to heterogeneity.", "esf": "Supports the ESF claim that autism-associated physiology reflects distributed regulatory challenges -- immune regulation is part of the stress system.", "supports": ["Immune dysregulation is part of the autism stress physiology story", "Neuroinflammation may reflect regulatory overload states"], "limits": "Heterogeneous evidence base; does not resolve direction of causation.", "next": "Use in Papers 2 and 3 for multisystem regulatory arguments."}, {"id": "delgiudice-2011", "layer": 3, "annotated": true, "citation": "Del Giudice, Ellis & Shirtcliff (2011)", "full": "Del Giudice, Marco, Bruce J. Ellis, and Elizabeth A. Shirtcliff. 2011. The Adaptive Calibration Model of Stress Responsivity. Neuroscience and Biobehavioral Reviews 35(7): 1562-92.", "tags": ["DEV", "STR", "EVO", "REG"], "claims": ["c06", "c03", "c08"], "argues": "The Adaptive Calibration Model proposes that stress responsivity develops in patterned ways in response to environmental conditions. Variation in responsivity is interpreted as developmental calibration rather than automatically as dysfunction.", "esf": "Foundational for reframing divergent neurodevelopment as patterned adaptation with trade-offs. Helps ESF talk about sensitivity, vigilance, shutdown, and reactivity without defaulting to defect language.", "supports": ["Stress responsivity is developmentally calibrated", "Divergence can reflect patterned adaptation", "Similar exposures can lead to different phenotypes"], "limits": "Some readers may overextend adaptation language into simplistic storytelling unless complexity and constraints are kept central.", "next": "Stronger developmental sections in ESF papers. Better explanations of neurotype emergence and heterogeneity."}, {"id": "ellis-delgiudice-2014", "layer": 3, "annotated": true, "citation": "Ellis & Del Giudice (2014)", "full": "Ellis, Bruce J., and Marco Del Giudice. 2014. Beyond Allostatic Load: Rethinking the Role of Stress in Regulating Human Development. Development and Psychopathology 26(1): 1-20.", "tags": ["DEV", "STR", "REG", "EVO"], "claims": ["c03", "c06", "c02"], "argues": "Critiques narrow load-based framings and argues that stress also plays organizing and regulatory roles in development. Rather than only causing wear and tear, stress can shape developmental strategy.", "esf": "One of the best direct allies to ESF's concern that stress science is too often linear. Strengthens the ESF move from stress-as-damage to stress-as-informational and regulatory patterning.", "supports": ["Stress is not only harmful load", "Development uses stress information to calibrate regulation", "Adaptive and costly outcomes are intertwined"], "limits": "The model remains stronger on developmental interpretation than on embodied interoceptive detail.", "next": "Explicit ESF critiques of toxic-stress simplifications. Better bridges between development, neurodiversity, and evolutionary framing."}, {"id": "belsky-pluess-2009", "layer": 3, "annotated": true, "citation": "Belsky & Pluess (2009)", "full": "Belsky, J., and M. Pluess. 2009. Beyond Diathesis Stress: Differential Susceptibility to Environmental Influences. Psychological Bulletin 135(6): 885-908.", "tags": ["DEV", "STR", "EVO", "SOC"], "claims": ["c13", "c06", "c09"], "argues": "Differential susceptibility proposes that some individuals are more responsive to both negative and positive environments. Sensitivity is not merely vulnerability; it can also confer greater benefit under supportive conditions.", "esf": "Useful for explaining why some highly sensitive or neurodivergent profiles may look impaired in one ecology and exceptional in another. Fits ESF's traits-and-trade-offs approach.", "supports": ["Sensitivity is context dependent", "Vulnerability and potential are linked", "Outcomes depend on organism-environment fit"], "limits": "Influential but broad; benefits from pairing with mechanistic and neurodiversity literature.", "next": "Better educational framing for parents and clinicians. Bridges to orchid/dandelion discussions without reducing neurotypes to clich\u00e9s."}, {"id": "ellis-2022", "layer": 3, "annotated": true, "citation": "Ellis et al. (2022)", "full": "Ellis, Bruce J., Laura S. Abrams, Ann S. Masten, Robert J. Sternberg, Nim Tottenham, and Willem E. Frankenhuis. 2022. Hidden Talents in Harsh Environments. Development and Psychopathology 34(1): 95-113.", "tags": ["DEV", "EVO", "ND", "SOC"], "claims": ["c06", "c09", "c13"], "argues": "Argues that environments commonly framed only as adverse may also cultivate specialized competencies and adaptive skills. Challenges one-dimensional damage models of development.", "esf": "Gives ESF a strong way to discuss calibration, specialization, and traits that emerge under stress without romanticizing hardship. Aligns with emphasis that adaptations carry costs but may also reveal distinct competencies.", "supports": ["Development under stress can produce patterned strengths", "Trade-offs are central to adaptation", "Standard performance metrics miss context-specific competencies"], "limits": "Must be used carefully so it does not minimize suffering or justify deprivation.", "next": "Better handling of autism, ADHD, and trauma-related trade-offs. Stronger arguments against purely deficit-based developmental models."}, {"id": "babenko-2015", "layer": 3, "annotated": false, "citation": "Babenko et al. (2015)", "full": "Babenko, Olena, Igor Kovalchuk, and Gerlinde A. S. Metz. 2015. Stress-Induced Perinatal and Transgenerational Epigenetic Programming of Brain Development and Mental Health. Neuroscience and Biobehavioral Reviews 48: 70-91.", "tags": ["DEV", "EPI", "STR"], "claims": ["c06", "c03"], "argues": "Reviews evidence that perinatal stress induces epigenetic changes that program brain development and can be transmitted across generations.", "esf": "Supports the ESF claim that stress signatures are not just individual but inherited and multigenerational -- the stress landscape is historical as well as current.", "supports": ["Developmental calibration operates across generations", "Epigenetic inheritance is part of the stress system"], "limits": "Mechanistic details are species- and context-specific; generalization requires care.", "next": "Use in Paper 2 for developmental trajectory arguments and in Paper 3 for the allostatic load-epigenetics bridge."}, {"id": "barabasi-2011", "layer": 4, "annotated": true, "citation": "Barabasi, Gulbahce & Loscalzo (2011)", "full": "Barabasi, Albert-Laszlo, Natali Gulbahce, and Joseph Loscalzo. 2011. Network Medicine: A Network-Based Approach to Human Disease. Nature Reviews Genetics 12(1): 56-68.", "tags": ["NET", "CLIN", "METH"], "claims": ["c07", "c08"], "argues": "Disease is best understood as the consequence of perturbations in interacting biological networks rather than isolated components. Provides frameworks for disease modules, multimorbidity, and systems-level vulnerability.", "esf": "Directly supports the ESF move away from single-cause narratives. Offers formal scientific backing for modeling autism and chronic illness as network states emerging from distributed perturbations and compensations.", "supports": ["Disease is an emergent network phenomenon", "Multimorbidity reflects connected disturbances, not unrelated comorbidity lists", "Precision medicine requires system mapping"], "limits": "Can remain insufficiently developmental or experiential unless integrated with developmental systems and neurodiversity scholarship.", "next": "Stronger multimorbidity arguments. Visual ESF maps of network disturbance. Conceptual connection between neurodevelopment and chronic disease clusters."}, {"id": "borsboom-2017", "layer": 4, "annotated": true, "citation": "Borsboom (2017)", "full": "Borsboom, D. 2017. A Network Theory of Mental Disorders. World Psychiatry 16(1): 5-13.", "tags": ["NET", "METH", "CLIN"], "claims": ["c07", "c08"], "argues": "Mental disorders are sustained networks of interacting symptoms and mechanisms rather than latent disease entities causing each symptom independently.", "esf": "Destabilizes the old hidden-essence model of psychiatric categories. Helps ESF argue that what gets called a disorder may be an emergent stable pattern maintained by interacting processes.", "supports": ["Categories may obscure distributed causal structure", "Conditions emerge from interacting processes", "Symptoms can become self-reinforcing network dynamics"], "limits": "On its own, network theory may underrepresent embodiment, metabolism, development, and ecology.", "next": "Stronger critiques of categorical nosology. Bridges to emergent neurotype arguments."}, {"id": "scheffer-2009", "layer": 4, "annotated": false, "citation": "Scheffer et al. (2009)", "full": "Scheffer, Marten, et al. 2009. Early-Warning Signals for Critical Transitions. Nature 461(7260): 53-59.", "tags": ["NET", "CLIN"], "claims": ["c07", "c10"], "argues": "Complex systems approaching critical transitions show predictable early-warning signals before tipping into new states.", "esf": "Supports the ESF model of autistic burnout, regulatory collapse, and threshold-based transitions. The system metaphor maps directly to stress overload and recovery dynamics.", "supports": ["Regulatory systems have tipping points and recovery slopes", "Burnout and crisis events may reflect system-level state transitions"], "limits": "Ecological origin; neurobiological translation requires careful framing.", "next": "Use in burnout and regulatory collapse framing. Visual model for stress landscape maps."}, {"id": "ward-2023", "layer": 4, "annotated": true, "citation": "Ward et al. (2023)", "full": "Ward, John H., Elizabeth Weir, Carrie Allison, and Simon Baron-Cohen. 2023. Increased Rates of Chronic Physical Health Conditions across All Organ Systems in Autistic Adolescents and Adults. Molecular Autism 14: 4.", "tags": ["ND", "CLIN", "NET", "STR"], "claims": ["c07", "c08"], "argues": "Reports increased rates of chronic physical health conditions across organ systems in autistic adolescents and adults.", "esf": "Crucial for demonstrating that autism cannot be understood only as a social-communication profile. Supports the ESF position that autistic health often involves broad organism-level regulation patterns and multimorbidity.", "supports": ["Autism is commonly associated with whole-body health variation", "Multimorbidity should be central, not peripheral, to autism science", "System-wide regulatory models are needed"], "limits": "Association data do not explain mechanism. ESF should use this alongside mechanistic and ecological studies.", "next": "Stronger justification for a full-body autism framework. Better bridges to chronic disease, inflammation, and energy regulation."}, {"id": "onions-2024", "layer": 4, "annotated": true, "citation": "O'Nions et al. (2024)", "full": "O'Nions, Elizabeth, et al. 2024. Estimating Life Expectancy and Years of Life Lost for Autistic People in the UK: A Matched Cohort Study. The Lancet Regional Health -- Europe 31: 100674.", "tags": ["ND", "CLIN", "SOC", "STR"], "claims": ["c07", "c08", "c12"], "argues": "Estimates significantly reduced life expectancy and increased years of life lost in autistic people in the UK.", "esf": "Underscores that the stakes are not merely theoretical or identity-based. Supports the claim that chronic stress burden, unmet support needs, healthcare mismatch, and multimorbidity must be treated as central public health issues.", "supports": ["Autistic health disparities are severe and measurable", "Existing systems are failing to support regulation and wellbeing", "Medical and social models must be integrated more effectively"], "limits": "These data do not identify one cause, which is precisely why ESF's systems approach is useful.", "next": "Stronger urgency in ESF clinical and policy arguments. Better framing of why broad regulatory models matter for real-world outcomes."}, {"id": "sosenko-2024", "layer": 4, "annotated": true, "citation": "Sosenko et al. (2024)", "full": "Sosenko, Filip, et al. 2024. Making a Case for an Autism-Specific Multimorbidity Index: A Comparative Cohort Study. EClinicalMedicine 71: 102589.", "tags": ["ND", "NET", "CLIN", "METH"], "claims": ["c07", "c08"], "argues": "Argues for an autism-specific multimorbidity index, recognizing that existing approaches inadequately capture the patterned health burden experienced by autistic populations.", "esf": "One of the clearest practical allies for ESF. Acknowledges that autism-related health burden is patterned, systemic, and poorly described by existing medical categories.", "supports": ["Autism multimorbidity needs its own systems-aware measurement logic", "Standard indexes underrepresent patterned autistic health complexity", "Better models must integrate diverse health dimensions"], "limits": "Measurement tools still need mechanistic grounding and neurodiversity-sensitive interpretation.", "next": "An ESF multimorbidity map or index concept. Better clinical translation of autism as organism-level heterogeneity."}, {"id": "miot-2023", "layer": 4, "annotated": true, "citation": "Miot et al. (2023)", "full": "Miot, S., et al. 2023. Multimorbidity Patterns and Subgroups among Autistic Adults with Intellectual Disability: Results from the EFAAR Study. Frontiers in Psychiatry 14: 1114760.", "tags": ["ND", "NET", "CLIN"], "claims": ["c07", "c08"], "argues": "Identifies multimorbidity patterns and subgroups among autistic adults with intellectual disability, showing that health burden clusters rather than appearing randomly.", "esf": "Supports one of the framework's strongest claims: chronic conditions often cluster in patterned ways because they are expressions of interacting system states rather than isolated accidents.", "supports": ["Autistic health burden clusters into patterned subgroup structure", "Heterogeneity is structured, not noise", "Subgrouping is important for useful science"], "limits": "Subgroup findings need careful interpretation across populations and support contexts.", "next": "Better ESF subgroup arguments. A basis for showing autism as manifold rather than singular spectrum."}, {"id": "kauffman-1993", "layer": 4, "annotated": false, "citation": "Kauffman (1993)", "full": "Kauffman, Stuart A. 1993. The Origins of Order: Self-Organization and Selection in Evolution. Oxford University Press.", "tags": ["NET", "EVO"], "claims": ["c07", "c11"], "argues": "Complex systems spontaneously generate order through self-organization -- the laws of complexity contribute to biological form and function alongside natural selection.", "esf": "Foundational for ESF's claim that neurodevelopmental patterns are not solely selected for but emerge from the dynamics of self-organizing regulatory systems.", "supports": ["Self-organization generates biological complexity independently of selection", "Order emerges from the system, not only from design or selection"], "limits": "Abstract theoretical; requires translation to specific neurodevelopmental contexts.", "next": "Cite in theoretical framing sections. Use as part of complexity evolution foundation alongside Jablonka & Lamb."}, {"id": "chapman-2021", "layer": 5, "annotated": true, "citation": "Chapman (2021)", "full": "Chapman, Robert. 2021. Neurodiversity and the Social Ecology of Mental Functions. Perspectives on Psychological Science 16(6): 1360-72.", "tags": ["ND", "SOC", "EVO", "METH"], "claims": ["c09", "c11", "c12"], "argues": "Mental functions should be understood in social-ecological context. Neurodiversity is not merely individual variation but part of a broader ecology of minds. Critiques deficit framings and emphasizes context, function, and distributed contribution.", "esf": "Aligns well with ESF's emphasis on niche, context, trade-offs, and cooperative variation. Helps ensure ESF remains diversity-affirming while remaining scientifically ambitious.", "supports": ["Neurodiversity is contextual and ecological, not merely intrapersonal", "Functional difference cannot be reduced to deficit", "Social environments are part of regulatory architecture"], "limits": "Conceptually strong but less mechanistic than some ESF audiences may want; pair with allostasis and systems biology papers.", "next": "Stronger neurodiversity-affirming framing in all ESF outputs. Bridge between social model insights and systems biology. Better articulation of cooperative neurodiversity."}, {"id": "botha-2024", "layer": 5, "annotated": true, "citation": "Botha et al. (2024)", "full": "Botha, Monique, Robert Chapman, Mor\u00e9nike Giwa Onaiwu, Steven K. Kapp, Abs Stannard Ashley, and Nick Walker. 2024. The Neurodiversity Concept Was Developed Collectively. Autism 28(6): 1591-94.", "tags": ["ND", "METH", "SOC"], "claims": ["c09"], "argues": "Corrects the historical record -- neurodiversity theory was developed collectively by autistic people rather than attributed to a single originator. Emphasizes community ownership and epistemic justice.", "esf": "Grounds ESF in the actual origins and meaning of neurodiversity. Essential for ethical framing -- scientific reframing must remain accountable to lived-experience traditions.", "supports": ["Neurodiversity is a collective conceptual development", "Scientific reframing must remain accountable to lived-experience traditions", "Historical accuracy matters for paradigm building"], "limits": "Primarily historical correction; connect to theoretical and empirical work for full integration.", "next": "Cite in all ESF introductions that discuss neurodiversity origins. Better framing against appropriation or neurodiversity-lite narratives."}, {"id": "milton-2012", "layer": 5, "annotated": true, "citation": "Milton (2012)", "full": "Milton, Damian E. M. 2012. On the Ontological Status of Autism: The Double Empathy Problem. Disability & Society 27(6): 883-87.", "tags": ["ND", "SOC", "METH"], "claims": ["c09", "c12"], "argues": "Social difficulties in autism are not unilateral deficits but bidirectional mismatches between different types of minds. The problem is relational, not intrinsic.", "esf": "Essential for protecting ESF from deficit interpretations of social difference. Helps frame relational strain as emergent mismatch across differently organized systems rather than one-sided impairment.", "supports": ["Social disability is relational, not only individual", "Misattunement can arise from differences in predictive and communicative style", "Context matters for reading social function"], "limits": "Not a biological account, so it should be integrated with interoceptive and stress-regulation work rather than treated as sufficient on its own.", "next": "Stronger ESF discussions of double empathy, niche fit, and cooperative neurodiversity. Better reframing of social functioning outcomes."}, {"id": "raymaker-2020", "layer": 5, "annotated": true, "citation": "Raymaker et al. (2020)", "full": "Raymaker, Dora M., et al. 2020. Having All of Your Internal Resources Exhausted beyond Measure: Defining Autistic Burnout. Autism in Adulthood 2(2): 132-43.", "tags": ["ND", "REG", "CLIN", "SOC"], "claims": ["c10", "c12", "c09"], "argues": "Community-based participatory research defining autistic burnout as a distinct state resulting from chronic masking and social-regulatory overload -- distinct from depression and clinical burnout. Characterizes burnout as chronic exhaustion, reduced functioning, and loss of skills resulting from life stress and mismatch between demands and available resources.", "esf": "Indispensable for translating ESF into human terms. Provides lived-experience evidence that autistic distress often reflects regulatory depletion, demand-resource mismatch, and prolonged adaptation cost rather than simple psychiatric comorbidity.", "supports": ["Burnout is a regulatory exhaustion state", "Functioning loss can emerge from cumulative demand-resource imbalance", "Lived experience is essential to accurate mechanistic framing"], "limits": "Conceptual and participatory paper, not a biomarker study. Its strength is definitional and ecological.", "next": "Strong ESF discussions of bandwidth, depletion, and adaptive cost. Bridges between autistic community knowledge and formal systems theory."}, {"id": "mantzalas-2022", "layer": 5, "annotated": true, "citation": "Mantzalas et al. (2022)", "full": "Mantzalas, Jane, Amanda L. Richdale, and Cheryl Dissanayake. 2022. A Conceptual Model of Risk and Protective Factors for Autistic Burnout. Frontiers in Psychiatry 12: 754343.", "tags": ["ND", "DEV", "SOC", "CLIN"], "claims": ["c10", "c12", "c09"], "argues": "Proposes a conceptual model of risk and protective factors for autistic burnout, emphasizing environmental demands, masking, invalidation, and inadequate supports.", "esf": "Connects burnout to ecological load and cumulative adaptation costs. Fits directly with emphasis that traits and trade-offs are shaped by environments, not merely by individual constitution.", "supports": ["Burnout is environmentally mediated, not purely intrapsychic", "Supportive context changes outcomes", "Chronic load accumulates through repeated mismatch and adaptation cost"], "limits": "Highly useful conceptually but benefits from pairing with autonomic, interoceptive, and metabolic evidence.", "next": "Better clinical translation of ESF into support recommendations. Stronger autism-and-environment sections in papers and talks."}, {"id": "scheeren-2025", "layer": 5, "annotated": true, "citation": "Scheeren et al. (2025)", "full": "Scheeren, Anke M., Smiddy Nieuwenhuis, Laura Crane, Yvette Roke, and Sander Begeer. 2025. Masking, Social Context and Perceived Stress in Autistic Adults: An Ecological Momentary Assessment Study. Autism 29(1): 168-80.", "tags": ["ND", "SOC", "STR", "CLIN"], "claims": ["c10", "c09", "c12"], "argues": "Using ecological momentary assessment, examines how masking, social context, and perceived stress interact in autistic adults in daily life.", "esf": "Exactly the kind of real-world, state-sensitive evidence ESF needs. Moves beyond static trait description and shows how regulation unfolds within shifting environments across time.", "supports": ["Stress in autism is dynamic and context dependent", "Masking carries moment-to-moment regulatory cost", "EMA methods are well suited to ESF questions"], "limits": "Perceived stress is only one layer; pairing with physiology and metabolic markers would deepen interpretation.", "next": "Stronger methodological proposals for ESF research. Better argument for temporal, ecological, and person-specific measurement."}, {"id": "murray-2005", "layer": 5, "annotated": true, "citation": "Murray, Lesser & Lawson (2005)", "full": "Murray, Dinah, Mike Lesser, and Wendy Lawson. 2005. Attention, Monotropism and the Diagnostic Criteria for Autism. Autism 9(2): 139-56.", "tags": ["ND", "INT", "REG", "CLIN"], "claims": ["c09", "c04", "c08"], "argues": "Proposes monotropism as a framework for understanding autistic attention and cognition, suggesting that focused allocation of attention shapes autistic experience more effectively than broad deficit accounts.", "esf": "Monotropism fits naturally with ESF because it can be read as a patterned energy-allocation and salience-distribution strategy. Helps reframe autism as a distinctive regulatory style rather than broken general cognition.", "supports": ["Attention reflects patterned allocation, not simple impairment", "Autistic cognition may follow different salience and energy priorities", "Traits and trade-offs are better models than deficits"], "limits": "Highly useful conceptually but should be paired with empirical work on stress, sensory processing, and ecological demands.", "next": "Better ESF treatment of autistic focus, overload, and burnout. Stronger translation for autistic lived experience."}, {"id": "pellicano-2022", "layer": 5, "annotated": true, "citation": "Pellicano & den Houting (2022)", "full": "Pellicano, Elizabeth, and Jacquiline den Houting. 2022. Annual Research Review: Shifting from Normal Science to Neurodiversity in Autism Science. Journal of Child Psychology and Psychiatry 63(4): 381-96.", "tags": ["ND", "METH", "CLIN", "SOC"], "claims": ["c09", "c08"], "argues": "Argues for a paradigm shift in autism science toward neurodiversity-informed methods, priorities, and interpretations. Critiques deficit-driven assumptions embedded in conventional autism research.", "esf": "Important because ESF is trying to offer a stronger scientific middle layer without falling back into old medical-model habits. Guides how that can be done responsibly.", "supports": ["Autism science must rethink its assumptions, methods, and aims", "Research priorities should align more closely with autistic community concerns", "Paradigm shifts are methodological as well as conceptual"], "limits": "Gives direction but less mechanistic detail than ESF aims to supply.", "next": "A strong ESF statement on research reform. Better justification for participatory and community-aligned methods."}, {"id": "dwyer-2022", "layer": 5, "annotated": false, "citation": "Dwyer (2022)", "full": "Dwyer, Patrick. 2022. The Neurodiversity Approach(es): What Are They and What Do They Mean for Researchers? Human Development 66(2): 73-92.", "tags": ["ND", "METH"], "claims": ["c09"], "argues": "Reviews the range of neurodiversity approaches and their implications for research design, framing, and methodology. Distinguishes neurodiversity as social movement, scientific framework, and paradigm.", "esf": "Helps ESF navigate between scientific use of neurodiversity concepts and respect for the movement's own claims -- prevents inadvertent appropriation or distortion.", "supports": ["Neurodiversity approaches exist on a spectrum from social to biological", "Research framing has political and ethical stakes"], "limits": "Analytical review; may need updating as the field evolves.", "next": "Use as methodological grounding for how ESF positions itself relative to neurodiversity research and advocacy."}, {"id": "hoffmann-2000", "layer": 6, "annotated": false, "citation": "Hoffmann & Hercus (2000)", "full": "Hoffmann, Ary A., and Miriam J. Hercus. 2000. Environmental Stress as an Evolutionary Force. BioScience 50(3): 217-26.", "tags": ["EVO", "STR"], "claims": ["c11", "c06"], "argues": "Environmental stress is a primary driver of evolutionary change -- populations exposed to stress show accelerated diversification, trait expression, and phenotypic variation.", "esf": "Directly grounds the ESF claim that variation in human neurodevelopmental patterns is partly a product of stress as an evolutionary force, not only pathology.", "supports": ["Stress generates adaptive variation", "Neurodevelopmental diversity may be stress-shaped evolutionary heritage"], "limits": "Population genetics framing; requires careful translation to human developmental contexts.", "next": "Foundational for ESF evolutionary claims. Bridge to Nevo (2011) and Steinberg (2012)."}, {"id": "jablonka-2007", "layer": 6, "annotated": false, "citation": "Jablonka & Lamb (2007)", "full": "Jablonka, Eva, and Marion J. Lamb. 2007. Precis of Evolution in Four Dimensions. Behavioral and Brain Sciences 30(4): 353-65.", "tags": ["EVO", "EPI", "DEV"], "claims": ["c11", "c06", "c14"], "argues": "Evolution operates in four dimensions: genetic, epigenetic, behavioral, and symbolic. Non-genetic inheritance is a fundamental evolutionary mechanism, not an exception.", "esf": "Expands the ESF evolutionary framework beyond gene-centric models -- epigenetic and behavioral transmission are core to how stress signatures propagate and how diversity is maintained.", "supports": ["Evolutionary framework must be 4-dimensional to account for neurodevelopmental diversity", "Epigenetic and behavioral inheritance are legitimate evolutionary mechanisms"], "limits": "The symbolic/cultural dimension is underdeveloped relative to the biological dimensions in most applications.", "next": "Cite in Paper 1 theoretical section. Core to ESF's complexity evolution rather than selection-only framing."}, {"id": "taylor-vestergaard-2022", "layer": 6, "annotated": false, "citation": "Taylor & Vestergaard (2022)", "full": "Taylor, Helen, and Martin David Vestergaard. 2022. Developmental Dyslexia: Disorder or Specialization in Exploration? Frontiers in Psychology 13: 889245.", "tags": ["EVO", "ND"], "claims": ["c11", "c09"], "argues": "Dyslexia may reflect a cognitive specialization in exploratory, divergent processing rather than a reading disorder -- an evolutionary trade-off between efficiency and exploration.", "esf": "Provides a concrete evolutionary reframing of a neurodiverse trait that ESF can extend to other neurotypes, including neuroperipheral profiles.", "supports": ["Neurodivergent cognitive styles may reflect adaptive specializations", "Evolutionary framing opens space beyond deficit models"], "limits": "Specific to dyslexia; generalization requires careful analogical reasoning.", "next": "Use as a model for ESF evolutionary reframing of neuroperipheral traits. Relevant to cooperative neurodiversity commentary."}, {"id": "taylor-2022", "layer": 6, "annotated": false, "citation": "Taylor, Fernandes & Wraight (2022)", "full": "Taylor, Helen, Brice Fernandes, and Sarah Wraight. 2022. The Evolution of Complementary Cognition. Cambridge Archaeological Journal 32(1): 61-77.", "tags": ["EVO", "SOC", "ND"], "claims": ["c11", "c09"], "argues": "Human evolution is characterized by complementary cognitive diversity -- different processing styles contribute to collective adaptive capacity. Neurodiversity is part of cooperative cognition architecture.", "esf": "One of the most direct supports for the ESF cooperative neurodiversity claim -- neurodivergent cognition is a functional component of collective stress regulation and adaptation.", "supports": ["Cognitive diversity serves collective adaptive function", "Neuroperipheral traits contribute to population-level resilience"], "limits": "Archaeological and theoretical; empirical testing of claims is limited.", "next": "Core citation for cooperative neurodiversity commentary and Paper 4. Pairs with Clutton-Brock (2009) and Levin (1998)."}, {"id": "constant-2018", "layer": 6, "annotated": true, "citation": "Constant et al. (2018)", "full": "Constant, Axel, Maxwell J. D. Ramstead, Samuel P. L. Veissi\u00e8re, John O. Campbell, and Karl J. Friston. 2018. A Variational Approach to Niche Construction. Journal of the Royal Society Interface 15(141): 20170685.", "tags": ["EVO", "PP", "SOC", "NET"], "claims": ["c14", "c11", "c12"], "argues": "Integrates niche construction with variational and predictive approaches, arguing that organisms actively shape the environments that make their regulation possible.", "esf": "Very important for the broader ESF move beyond mismatch-only stories. Supports the claim that organisms and collectives do not merely adapt to environments but co-create regulatory niches.", "supports": ["Niche construction is part of regulation", "Environment is not external background but part of the adaptive system", "Diversity may matter because different organisms help construct different niches"], "limits": "Abstract and formal; benefits from translation into development, disability, and public-health language.", "next": "Stronger ESF arguments about supportive environments and ecosystem health. Better theoretical grounding for cooperative neurodiversity."}, {"id": "levin-1998", "layer": 6, "annotated": true, "citation": "Levin (1998)", "full": "Levin, Simon A. 1998. Ecosystems and the Biosphere as Complex Adaptive Systems. Ecosystems 1(5): 431-36.", "tags": ["EVO", "NET", "SOC", "METH"], "claims": ["c11", "c07", "c14"], "argues": "Describes ecosystems as complex adaptive systems characterized by distributed interactions, heterogeneity, scale dependence, and emergent stability.", "esf": "Helps justify ecosystem-level thinking. Supports the move from seeing neurodiversity as isolated individual difference to understanding it as part of population-level regulatory architecture.", "supports": ["Diversity contributes to adaptive system function", "Stability emerges from distributed heterogeneity", "Human populations can be modeled with ecological logic"], "limits": "The ecological analogy must be handled carefully so that human diversity is not flattened into simplistic functionalism.", "next": "Stronger cooperative-neurodiversity arguments. Better language for distributed stress regulation across populations."}, {"id": "oyama-2000", "layer": 6, "annotated": false, "citation": "Oyama (2000)", "full": "Oyama, Susan. 2000. The Ontogeny of Information: Developmental Systems and Evolution. Duke University Press.", "tags": ["EVO", "DEV", "METH"], "claims": ["c14", "c06"], "argues": "Information is not pre-formed in genes but constructed through organism-environment interaction across development. Nature and nurture are co-constructing processes, not separable sources.", "esf": "Foundational for ESF's rejection of nature/nurture framing. The organism-environment system is the unit of development; neurodevelopmental patterns emerge through interaction.", "supports": ["The organism-environment system is the unit of development", "Neurodevelopmental patterns emerge through interaction, not pre-specification"], "limits": "Dense theoretical text; requires translation for clinical and advocacy audiences.", "next": "Theoretical foundation for ESF's developmental systems position. Essential for Paper 1's conceptual scaffolding."}]}</script>
<script>
(function(){

function rgb(h){var r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?parseInt(r[1],16)+','+parseInt(r[2],16)+','+parseInt(r[3],16):'255,255,255';}
